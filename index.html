x);line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere;font-weight:570}.choiceList{display:grid;gap:9px;margin-top:20px}.choice{display:flex;gap:12px;text-align:left;align-items:flex-start;width:100%;padding:15px 13px;border-radius:12px;min-height:56px;border:1.5px solid #cbd6e4;background:#fff;color:#172a44;font-size:var(--choice-size,17px);line-height:1.52;overflow-wrap:anywhere}.choice .symbol{font-weight:900;color:#2b609d;font-size:21px;line-height:1.1;flex:none}.choice.correct{border:2px solid #139661;background:#ecfcf3}.choice.wrong{border:2px solid #cb594a;background:#fff3f0}.choice:disabled{opacity:1}.choice:active:not(:disabled){background:#ebf3ff}.answerPanel{margin-top:18px;border-top:2px solid #e4eaf3;padding-top:18px;scroll-margin-top:12px}.result{padding:14px;border-radius:12px;font-size:18px;font-weight:850;margin-bottom:15px}.result.good{background:#e7f8ed;color:#10663e}.result.bad{background:#fff0ee;color:#ad392f}.exHeading{font-size:16px;font-weight:850;margin:18px 0 10px}.clues{background:#f2f6fc;border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.7}.clues ul{padding-left:20px;margin:4px 0 0}.conclusion{font-weight:780;margin-top:12px}.exOption{border:1px solid #e2e8f1;border-radius:11px;padding:11px 12px;margin-bottom:8px;font-size:15px;line-height:1.65}.exOption b{display:block;margin-bottom:3px;color:#285d9a}.exOption.right{border-color:#a7d5ba;background:#f1fbf5}.exOption.right b{color:#158050}.bottomNav{display:flex;gap:10px;align-items:center;margin-top:14px}.bottomNav .btn{flex:1}.hint{color:#718095;font-size:12px;line-height:1.6;margin-top:11px}.hidden{display:none!important}.barRow{display:flex;justify-content:space-between;align-items:center;gap:8px}.muted{color:#62758e;font-size:13px}.review{margin:12px 0 0;padding:8px 10px;background:#f5f7fb;border-radius:9px;color:#51647b;font-size:12px;line-height:1.6}#numberPicker{max-width:130px;min-height:40px;border-radius:8px;border:1px solid #c5d2e3;color:#234779;padding:5px;background:white}footer{color:#738094;font-size:11px;line-height:1.6;text-align:center;padding:8px 12px 20px}.zoomControl{display:flex;align-items:center;gap:4px}.zoomControl button{border:1px solid #cbd6e4;background:#fff;border-radius:7px;min-height:37px;min-width:37px;color:#214c83;font-weight:800}.zoomControl span{font-size:12px;min-width:31px;text-align:center;color:#45617d}@media(max-width:380px){header h1{font-size:18px}.wrap{padding-left:9px;padding-right:9px}.panel{padding:13px}.prompt{font-size:calc(var(--prompt-size,19px) - 1px)}.choice{padding:13px 11px}}@media(min-width:900px){.wrap{max-width:780px}.prompt{font-size:21px}}

<script>const DB={"eras":["선사·초기 국가","삼국·가야","통일 신라","발해","후삼국","고려 초기","고려 중기","무신 정권기","고려 말기","조선 초기","조선 후기","흥선 대원군","개항기·대한제국","일제 강점기","광복·정부 수립","이승만·장면","5·16·박정희","전두환","노태우","김영삼","김대중","노무현 이후"],"questions":[{"id":"70-1","exam":70,"number":1,"era":0,"answer":3,"score":1,"prompt":"(가) 시대의 생활 모습으로 가장 적절한 것은? [1점]\n오전 10:20 98%\n<오늘의 한국사 퀴즈>\n매일 문제 풀고 한국사 박사 되자!\n◆ 사유 재산과 계급이 발생한 (가)\n시대의 대표적인 유물을 고르시오.\n다음 문제▶ 정답","choices":["철제 무기로 정복 활동을 벌였다.","오수전, 화천 등의 중국 화폐로 교역하였다.","많은 인력을 동원하여 고인돌을 축조하였다.","주로 동굴이나 강가에 막집을 짓고 거주하였다.","가락바퀴와 뼈바늘을 사용하여 옷을 만들기 시작하였다."],"theme":"청동기 시대의 생활과 유물","clues":["사유 재산과 계급 발생은 청동기 시대의 대표적 특징입니다.","고인돌은 계급 사회를 보여 주는 대표적인 무덤입니다."],"conclusion":"정답은 ③ 고인돌 축조입니다.","explanations":["철제 무기와 정복 활동은 철기 문화 발전과 관련됩니다.","오수전·화천 등 중국 화폐의 유통은 철기 시대의 교류를 보여 줍니다.","청동기 시대에는 지배층이 많은 인력을 동원하여 고인돌을 만들었습니다.","동굴·강가의 막집 생활은 구석기 시대의 특징입니다.","가락바퀴와 뼈바늘 사용은 신석기 시대의 생활 모습입니다."]},{"id":"70-2","exam":70,"number":2,"era":0,"answer":3,"score":2,"prompt":"(가) 나라에 대한 설명으로 옳은 것은? [2점]\n학습 내용 정리\n<철기 문화를 바탕으로 성장한 여러 나라>\n1. 경제 활동\n나라 사료에 나타난 특징\n부여 관직명에 가축 이름 사용, 명마·담비 가죽 생산\n(가) 삼베·명주 생산, 특산물: 단궁·과하마·반어피\n삼한 벼농사 발달, 철이 많아 낙랑·왜에 수출","choices":["신지, 읍차 등의 지배자가 있었다.","혼인 풍습으로 민며느리제가 있었다.","10월에 무천이라는 제천 행사를 열었다.","여러 가(加)들이 각각 사출도를 주관하였다.","제가 회의에서 나라의 중대사를 결정하였다."],"theme":"동예의 경제와 사회","clues":["단궁·과하마·반어피는 동예의 특산물입니다.","동예는 책화와 10월 무천 등의 풍습이 있었습니다."],"conclusion":"정답은 ③ 동예의 제천 행사 무천입니다.","explanations":["신지·읍차는 삼한의 지배자 명칭입니다.","민며느리제는 옥저의 풍습으로 동예와 구분해야 합니다.","무천은 동예의 10월 제천 행사입니다.","사출도와 가축 이름 관직은 부여의 특징입니다.","제가 회의는 고구려의 귀족 회의입니다."]},{"id":"70-3","exam":70,"number":3,"era":1,"answer":2,"score":3,"prompt":"다음 자료에 나타난 사건의 영향으로 가장 적절한 것은? [3점]\n왕이 문주에게 일러 말하기를, “내가 어리석고 밝지 못하여\n간사한 사람[도림]의 말을 믿어 이 지경이 되었다. …… 나는 마땅히\n사직에서 죽겠지만, 네가 이곳에서 함께 죽는 것은 이로울 게 없다.\n어찌 난을 피하여 나라의 계통을 잇지 않겠는가?”라고 하였다. ……\n고구려의 대로 제우·재증걸루·고이만년 등이 북성을 공격하여\n7일 만에 빼앗았다. 이동하여 남성을 공격하니 성 안 사람들이\n두려워하였다. 왕이 성을 나와 도망하자, 고구려 장수 재증걸루\n등이 왕을 보고 말에서 내려 절한 다음에 그 얼굴을 향해 세 번 침을\n뱉고는 죄를 나열한 다음 포박하여 아차성 아래로 보내 죽였다.","choices":["고구려가 평양으로 천도하였다.","동성왕이 나제 동맹을 강화하였다.","고국원왕이 근초고왕의 공격을 받아 전사하였다.","백제가 고구려를 견제하고자 북위에 국서를 보냈다.","신라가 왜를 격퇴하기 위해 고구려에 군사를 청하였다."],"theme":"장수왕의 한성 함락과 백제의 웅진 천도","clues":["고구려 장수왕의 백제 공격으로 개로왕이 죽은 475년의 사건입니다.","백제는 왕의 죽음 이후 문주왕 때 웅진으로 천도했습니다."],"conclusion":"정답은 ② 동성왕의 나제 동맹 강화입니다.","explanations":["평양 천도는 장수왕이 427년에 단행한 일로, 한성 함락보다 앞섭니다.","동성왕 때 백제와 신라는 고구려를 견제하며 나제 동맹을 강화했습니다.","고국원왕 전사는 근초고왕이 평양성을 공격한 371년의 사건입니다.","백제의 북위 국서 발송은 개로왕 때로, 한성 함락 이전입니다.","왜를 격퇴하기 위한 신라의 고구려 군사 요청은 내물왕 때와 관련됩니다."]},{"id":"70-4","exam":70,"number":4,"era":1,"answer":1,"score":2,"prompt":"(가) 왕의 재위 시기에 있었던 사실로 옳은 것은? [2점]\n스스로 탐구하는 역사 수업\n고구려 제17대 왕으로 즉위하여 통치 체제를 정비한\n(가) 에 대해 조사한 내용을 올려 주세요.\n정치 사회 외교\n전진에 사신을\n태학을 설립하여\n율령을\n파견하여\n인재를\n반포하였어요.\n교류하였어요.\n양성하였어요.","choices":["승려 순도를 통해 불교를 수용하였다.","낙랑군을 축출하여 영토를 확장하였다.","영락이라는 독자적인 연호를 사용하였다.","을지문덕이 살수에서 수의 군대를 물리쳤다.","이문진이 유기를 간추린 신집 5권을 편찬하였다."],"theme":"소수림왕: 불교·태학·율령","clues":["율령 반포, 태학 설립, 전진에 사신 파견은 소수림왕의 업적입니다.","소수림왕은 372년에 불교를 수용하고 태학을 세웠습니다."],"conclusion":"정답은 ① 승려 순도를 통한 불교 수용입니다.","explanations":["372년 전진에서 온 순도를 통해 불교를 수용했습니다.","낙랑군을 축출한 인물은 미천왕(313년)입니다.","영락은 광개토 대왕이 사용한 독자적인 연호입니다.","살수 대첩(612년)은 영양왕 때 을지문덕의 활약입니다.","이문진의 『신집』 5권 편찬은 영양왕 때의 일입니다."]},{"id":"70-5","exam":70,"number":5,"era":1,"answer":2,"score":2,"prompt":"강연자의 질문에 대한 청중의 답변으로 가장 적절한 것은? [2점]\n화면에 보이는 고구려의 사신도와 백제 산수무늬 벽돌은 신선 사상을 기반으로 불로장생을 추구하는 이 종교의 내용이 잘 표현된 문화유산입니다. 이 종교와 관련된 역사적 사실은 무엇이 있을까요?\n산수무늬 벽돌 강서대묘 사신도 중 현무도","choices":["간경도감에서 경전이 간행되었습니다.","연개소문이 당에 도사 파견을 요청하였습니다.","과거 시험의 교재로 사서집주가 채택되었습니다.","범일이 9산 선문 중 하나인 사굴산문을 개창하였습니다.","주요 경전의 이름이 새겨진 임신서기석이 만들어졌습니다."],"theme":"도교 사상과 고구려의 당 교류","clues":["사신도와 산수무늬 벽돌은 도교적 신선 사상과 연결됩니다.","삼국 시대 이후 도교와 관련된 교류 사례를 찾는 문제입니다."],"conclusion":"정답은 ② 연개소문의 도사 파견 요청입니다.","explanations":["간경도감은 조선 세조 때 불경 간행을 위해 설치했습니다.","연개소문 집권기의 고구려는 당에 도사 파견을 요청했습니다.","『사서집주』는 성리학의 대표적 저술로 도교 경전이 아닙니다.","범일의 사굴산문 개창은 신라 말 선종의 전개와 관련됩니다.","임신서기석은 유교 경전 학습과 충성의 맹세를 보여 주는 신라의 유물입니다."]},{"id":"70-6" ion":"정답은 ③ 『격황소서』를 지은 최치원입니다.","explanations":["『삼대목』은 위홍과 대구화상이 편찬한 향가집입니다.","『청방인문표』는 최승우의 외교 문서입니다.","최치원은 『격황소서』를 지어 문장가로 인정받았습니다.","『해심밀경소』는 원측의 유식 관련 저술입니다.","『화왕계』는 설총이 신문왕에게 들려준 글입니다."]},{"id":"70-9","exam":70,"number":9,"era":2,"answer":4,"score":3,"prompt":"다음 상황이 나타난 시기를 연표에서 옳게 고른 것은? [3점]\n각간 김경신이 해몽을 청하자 아찬 여삼은 “복두를 벗은 것은\n위에 다른 사람이 없다는 뜻이요, 소립을 쓴 것은 면류관을 쓸\n징조이며, 12현금(絃琴)을 든 것은 12대손까지 왕위를 전한다는\n조짐이며, 천관사 우물로 들어간 것은 궁궐로 들어갈 상서로운\n조짐입니다.”라고 하였다. “위에 주원이 있는데 어찌 내가 왕위에\n오를 수 있겠소?”라고 경신이 묻자, 아찬이 대답하기를 “청컨대\n은밀히 북천신에게 제사 지내면 될 것입니다.”라고 하여 이에\n따랐다. 얼마 지나지 않아 선덕왕이 죽자, 나라 사람들이 김주원을\n왕으로 받들어 궁중으로 맞아들이려 했다. 주원의 집은 북천\n북쪽에 있었는데 홀연히 냇물이 불어나 건널 수가 없었다. 이에\n경신이 먼저 궁궐로 들어가 왕위에 올랐다.\n654 681 722 780 889\n828\n(가) (나) (다) (라) (마)\n무열왕\n김흠돌의\n정전 지급\n혜공왕\n청해진\n원종과 애노의 난\n즉위\n난\n피살\n설치","choices":["(가)","(나)","(다)","(라)","(마)"],"theme":"원성왕 즉위와 신라 하대 왕위 계승","clues":["김경신이 김주원을 제치고 원성왕으로 즉위한 시기는 785년입니다.","혜공왕 피살(780년) 뒤 왕위 계승 다툼이 심해졌습니다."],"conclusion":"정답은 ④ (라), 780~828년 사이입니다.","explanations":["654~681년은 원성왕 즉위 이전입니다.","681~722년 역시 원성왕 즉위 이전입니다.","722~780년은 원성왕 즉위 직전까지의 구간입니다.","원성왕 즉위(785년)는 780~828년 구간에 속합니다.","828~889년은 원성왕 즉위보다 뒤의 시기입니다."]},{"id":"70-10","exam":70,"number":10,"era":4,"answer":3,"score":2,"prompt":"(가)에 들어갈 내용으로 적절한 것은? [2점]\n한국사 동영상 제작 계획안\n다시 하나로, 민족의 재통일을 이루다\n◯ 학년 ◯ 반 ◯ 모둠\n▣ ‌ 제작 의도\n고려의 후삼국 통일 과정과 역사적 의의를 주요 인물과\n관련된 사건의 발생 순서에 따라 살펴본다.\n▣ 장면별 구성 내용\n#1. 신숭겸, 공산 전투에서 전사하다\n#2. 왕건, 고창 전투에서 후백제군을 물리치다\n#3. 견훤, 금산사에서 탈출하여 고려에 귀순하다\n#4. (가)\n#5. 왕건, 일리천에서 신검의 군대에 승리하다","choices":["안승, 보덕국왕으로 책봉되다","궁예, 국호를 태봉으로 바꾸다","경순왕 김부, 경주의 사심관이 되다","윤충, 대야성을 공격하여 함락시키다","흑치상지, 임존성에서 부흥군을 이끌다"],"theme":"후삼국 통일 과정과 경순왕의 항복","clues":["공산 전투(927), 고창 전투(930), 견훤 귀순(935), 일리천 전투(936)의 순서를 파악합니다.","935년 신라 경순왕이 고려에 항복한 사실이 중간 단계입니다."],"conclusion":"정답은 ③ 경순왕 김부가 경주의 사심관이 된 일입니다.","explanations":["안승의 보덕국 책봉은 신라의 삼국 통일 과정과 관련되며 후삼국보다 앞섭니다.","궁예의 태봉 국호 변경(911년)은 공산 전투 이전입니다.","경순왕은 고려에 항복(935년)했고, 왕건은 그를 경주의 사심관으로 삼았습니다.","윤충의 대야성 함락은 백제 의자왕 때의 삼국 시대 사건입니다.","흑치상지의 임존성 부흥 운동은 백제 멸망 직후의 일입니다."]},{"id":"70-11","exam":70,"number":11,"era":5,"answer":4,"score":1,"prompt":"(가) 국가의 경제 상황으로 옳은 것은? [1점]\n이것은 (가) 시대에 다인철소에서 생산된 유물들입니다. 특수 행정 구역이었던 소에 대해 검색한 것을 말해 볼까요?\n(가) 시대에는 가혹한 수탈에 맞서\n공주 명학소에서 봉기가 일어나기도\n하였어요.\n국가가 지정한\n특정 물품을 생산하여 공급하였던\n소의 주민들은 일반 군현민에 비해\n차별을 받았어요.","choices":["특산품으로 솔빈부의 말이 유명하였다.","풍흉에 따라 9등급으로 전세를 거두었다.","감자, 고구마 등의 작물이 널리 재배되었다.","경시서의 관리들이 시전의 상행위를 감독하였다.","설점수세제를 시행하여 민간의 광산 개발을 허용하였다."],"theme":"고려의 경제와 시전 감독","clues":["공주 명학소의 봉기는 망이·망소이의 난으로, 고려 무신 정권기 특수 행정 구역 주민들의 저항입니다.","고려에는 수도 개경의 시전과 이를 감독하는 경시서가 있었습니다."],"conclusion":"정답은 ④ 경시서가 시전 상행위를 감독한 사실입니다.","explanations":["솔빈부의 말은 발해의 특산물로 고려의 경제 상황이 아닙니다.","풍흉에 따라 전세를 9등급으로 거두는 영정법은 조선 후기 정책과 다릅니다. 9등급 풍흉제는 조선 전기 공법의 연분 구등법입니다.","감자·고구마는 조선 후기에 전래·보급된 구황 작물입니다.","경시서는 고려 개경의 시전을 감독하던 관청입니다.","설점수세제는 조선 후기 광산 개발을 허용하는 방식입니다."]},{"id":"70-12","exam":70,"number":12,"era":5,"answer":3,"score":3,"prompt":"(가)~(마)에 들어갈 내용으로 적절한 것은? [3점]\n<한국사 학술 강좌>\n인물로 보는 고려 불교사\n우리 학회에서는 고려 승려들의 활동을 통해\n불교사의 흐름을 파악하는 자리를 마련하였습니다.\n관심 있는 분들의 많은 참여를 바랍니다.\n▣ 강좌 주제 ▣\n제1강 균여, (가)\n제2강 의천, (나)\n제3강 지눌, (다)\n제4강 요세, (라)\n제5강 혜심, (마)\n•일시: ‌ 2024년 ◯◯월 ◯◯일 09:00~17:00\n•장소: □□ 박물관 대강당\n•주최: △△ 학회","choices":["(가) - 법화 신앙에 중점을 둔 백련 결사를 제창하다","(나) - 심성의 도야를 강조한 유불 일치설을 주장하다","(다) - 권수정혜결사문을 작성하여 정혜쌍수를 강조하다","(라) - 이론과 수행을 함께 강조하는 교관겸수를 제시하다","(마) - 보현십원가를 지어 불교 교리를 대중에게 전파하다"],"theme":"고려 불교의 승려와 결사 운동","clues":["균여·의천·지눌·요세·혜심의 활동을 서로 구별하는 문제입니다.","지눌은 수선사 결사를 제창하고 정혜쌍수·돈오점수를 강조했습니다."],"conclusion":"정답은 ③ 지눌의 권수정혜결사문과 정혜쌍수입니다.","explanations":["백련 결사는 요세가 주도한 운동이지 균여의 활동이 아닙니다.","교관겸수는 의천의 주장입니다. 유불 일치설은 혜심과 관련된 설명입니다.","지눌은 정혜쌍수를 강조하며 권수정혜결사문을 지었습니다.","교관겸수를 주장한 승려는 의천이며, 요세는 백련 결사를 주도했습니다.","보현십원가는 균여가 지은 향가이며 혜심의 저술이 아닙니다."]},{"id":"70-13","exam":70,"number":13,"era":5,"answer":1,"score":2,"prompt":"(가) 왕에 대한 설명으로 옳은 것은? [2점]\n이것은 조카 헌종을 몰아내고 즉위한 (가) 의 넷째 딸인 복령 궁주 왕씨 묘지명입니다. 여기에서는 복령 궁주를 ‘천자의 딸’이라고 표현하여 국왕의 권위를 드러내고자 하였습니다. (가) 은/는 개경 세력을 견제하고자 남경에 궁궐을 짓고, 재정을 확보하기 위해 주전도감을 "],"conclusion":"정답은 ③ 중종 때 사림 언관들의 주장을 조사합니다.","explanations":["호포제는 흥선 대원군이 실시한 군정 개혁입니다.","기해 예송은 효종 사후 복상 문제로 벌어진 현종 때 논쟁입니다.","소격서 폐지와 현량과 시행은 중종 때 조광조 등의 사림파 주장입니다.","기축옥사는 선조 때 정여립 모반 사건으로 시작됐습니다.","인현왕후 폐위와 남인 집권은 숙종 때 기사환국입니다."]},{"id":"70-21","exam":70,"number":21,"era":10,"answer":1,"score":2,"prompt":"(가) 전쟁 중에 있었던 사실로 옳은 것은? [2점]\n문학으로 만나는 한국사\n홍계남이 당초 의병을 일으켜 흉적을 쳐서 활을\n쏘아 맞히고 벤 수급이 매우 많았고 가는 곳마다 공을\n세우니, 적들이 홍장군이라고 부르며 감히 침범하지\n못했다. 호서(충청도) 내지가 편안할 수 있었던 것은\n모두 홍계남의 공이라고 한다. 가상한 일이다. 의병이\n곳곳에서 봉기하였지만, …… 고경명과 조헌은\n모두 나랏일에 몸을 바쳐 죽을 자리에서 죽었으니\n가히 그 명성에 걸맞는다고 말할 수 있다.\n- 『쇄미록』 -\n[해설] 이 작품은 오희문이 (가) 중에 있었던 일을 적은 일기이다. 적군의 침입과 약탈, 의병장의 활동, 피란민의 참혹한 생활 등이 생생하게 담겨 있다.","choices":["삼수병으로 구성된 훈련도감이 설치되었다.","왕이 도성을 떠나 남한산성으로 피란하였다.","송시열, 이완 등을 중심으로 북벌이 추진되었다.","국방 문제를 논의하기 위해 비변사가 신설되었다.","제한된 범위의 무역을 허용한 계해약조가 체결되었다."],"theme":"임진왜란과 훈련도감 설치","clues":["홍계남·고경명·조헌 등의 의병장과 일본군 침입은 임진왜란(1592)을 가리킵니다.","장기전에 대비하여 1593년 훈련도감이 설치되었습니다."],"conclusion":"정답은 ① 훈련도감 설치입니다.","explanations":["훈련도감은 임진왜란 중 설치되어 포수·사수·살수의 삼수병으로 편성됐습니다.","남한산성 피란은 1636년 병자호란 당시 인조의 대응입니다.","송시열·이완 등의 북벌론은 효종 때입니다.","비변사 설치는 임진왜란 이전 중종 때 왜구·여진 문제에 대응하면서 이뤄졌습니다.","계해약조는 1443년 세종 때 왜인과의 교역을 제한한 약조입니다."]},{"id":"70-22","exam":70,"number":22,"era":10,"answer":5,"score":3,"prompt":"(가)~(마)에 대한 설명으로 적절하지 않은 것은? [3점]\n답사 계획서\n● 주제: 불교 문화유산이 숨 쉬는 곳, 산사(山寺)를 찾아서\n- 유네스코가 주목한 사찰을 중심으로\n● 기간: 2024년 ○○월 ○○일~○○일\n● 경로: ‌ 보은 법주사 → 영주 부석사 → 안동 봉정사 → 합천 해인사\n→ 순천 선암사\n(나) 영주 부석사\n(가) 보은 법주사\n(다) 안동 봉정사\n(마) 순천 선암사\n(라) 합천 해인사","choices":["(가) - 오층 목조탑 내부에 부처의 일생을 그린 팔상도가 있다.","(나) - 배흘림기둥에 주심포 양식으로 축조된 무량수전이 있다.","(다) - ‌ 현존하는 우리나라 최고(最古)의 목조 건물인 극락전이 있다.","(라) - 팔만대장경판을 보관하고 있는 장경판전이 있다.","(마) - 무구정광대다라니경이 발견된 삼층 석탑이 있다."],"theme":"한국의 산사와 문화유산","clues":["법주사·부석사·봉정사·해인사·선암사는 각기 다른 시대 문화재를 품은 사찰입니다.","무구정광대다라니경은 불국사 삼층 석탑에서 발견됐습니다."],"conclusion":"정답은 ⑤ 선암사에 대한 설명이 잘못됐습니다.","explanations":["보은 법주사 팔상전은 목조 오층탑 형식으로 팔상도와 관련됩니다.","영주 부석사 무량수전은 배흘림기둥과 주심포 양식으로 유명합니다.","안동 봉정사 극락전은 현존하는 오래된 목조 건축물입니다.","합천 해인사 장경판전에는 팔만대장경판을 보관하고 있습니다.","무구정광대다라니경은 경주 불국사 삼층 석탑에서 발견됐으므로 선암사 설명이 아닙니다."]},{"id":"70-23","exam":70,"number":23,"era":10,"answer":2,"score":2,"prompt":"밑줄 그은 ‘제도’에 대한 설명으로 옳은 것을 <보기>에서 고른\n것은? [2점]\n이번에 시행되는 제도는 지방의 특산물을 징수하면서 나타난 방납의 폐단을 막아 백성들의 부담을 줄여주기 위한 것입니다. 공물을 현물 대신 토지의 결 수에 따라 쌀로 납부합니다.\n이원익의 건의로 경기도에서 시행되는 수취 제도에 대해 설명해 주세요.\n<보 기>\nㄱ. 선혜청에서 관련 업무를 담당하였다.\nㄴ. 재정을 보충하기 위해 지주에게 결작을 부과하였다.\nㄷ. 관청에 물품을 조달하는 공인이 등장하는 배경이 되었다.\nㄹ. 어장세, 선박세 등이 국가 재정으로 귀속되는 결과를 가져왔다.","choices":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ"],"theme":"광해군 시기 대동법과 공인","clues":["이원익의 건의로 1608년 경기도에서 시행된 공납 개혁은 대동법입니다.","대동법은 선혜청이 담당하고 공인의 등장과 상품 화폐 경제 발달에 영향을 주었습니다."],"conclusion":"정답은 ② ㄱ(선혜청), ㄷ(공인)입니다.","explanations":["ㄱ은 맞지만 ㄴ의 결작은 영조의 균역법에서 부족한 군포 수입을 보충한 제도입니다.","선혜청 담당(ㄱ)과 공인 등장(ㄷ)이 모두 대동법의 특징입니다.","ㄴ의 결작은 대동법이 아니라 균역법 관련 세금입니다.","결작(ㄴ), 어장세·선박세 국고 귀속(ㄹ)은 균역법의 보완책입니다.","ㄹ의 어장세·선박세 재정 편입은 균역법과 관련됩니다."]},{"id":"70-26","exam":70,"number":26,"era":10,"answer":4,"score":2,"prompt":"(가) 인물에 대한 설명으로 옳은 것은? [2점]\n우리 모둠은 열하일기에서 상공업 진흥과 청의 문물 수용을 주장한 (가) 에 대해 발표하려고 합니다.\n모둠별 주제 탐구\n조선 후기 실학자의 활동\n2모둠\n1모둠\n성호사설에서\n지전설과 무한우주론을 주장한 홍대용\n개혁안을 제시한 이익\n3모둠\n화폐 유통의 필요성을 주장한\n(가)","choices":["북한산비가 진흥왕 순수비임을 고증하였다.","청으로부터 시헌력을 도입하자고 건의하였다.","우서에서 사농공상의 직업적 평등을 주장하였다.","양반전을 지어 양반의 허례와 무능을 풍자하였다.","10리마다 눈금을 표시한 대동여지도를 완성하였다."],"theme":"박지원과 북학파 실학","clues":["열하일기와 상공업 진흥, 청의 문물 수용을 주장한 인물은 박지원입니다.","박지원은 양반전을 통해 양반의 허례와 무능을 풍자했습니다."],"conclusion":"정답은 ④ 양반전을 지었습니다.","explanations":["북한산비를 진흥왕 순수비로 고증한 인물은 김정희입니다.","시헌력 도입을 건의한 인물은 김육입니다.","우서에서 직업적 평등을 주장한 인물은 유수원입니다.","양반전은 박지원이 지은 한문 소설입니다.","대동여지도는 김정호가 제작했습니다."]},{"id":"70-28","exam":70,"number":28,"era":11,"answer":2,"score":3,"prompt":"(가), (나) 사이의 시기에 있었던 사실로 옳은 것은? [3점]\n(가) ‌ 순무영에서 정족산성 수성장 양헌수가 보내온 보고에 의하면,\n“…… 우리 군사가 잠입한 사실을 적들이 알지 못하였습니다.\n오늘 저들은 우리가 지키고 있는 성을 점령할 계책으로 그\n우두머리가 말을 타고 나귀를 끌고 짐바리와 술과 음식을\n가지고 동문과 남문으로 나누어 들어왔습니다. 이때 우리\n군사들이 좌우에 매복하였다가 일제히 총탄을 퍼부었습니다.\n……”라고 하였습니다.\n(나) ‌ 4월 24일에 계속해서 올린 강화 진무사 정기원의 치계에,\n“미국 배가 다시 항구로 들어 의 평양성 공격(371) → 침류왕 불교 수용(384) → 성왕 사비 천도(538)가 옳습니다."]},{"id":"71-6","exam":71,"number":6,"era":1,"answer":3,"score":2,"prompt":"밑줄 그은 ‘왕’에 대한 설명으로 옳은 것은? [2점]\n여러 신하들이 국호를 신라로 확정하고 임금의 호칭을 신라 국왕으로 하자고 건의하니, 왕께서 이를 따르셨다고 하네.\n나도 들었네. 작년에는 순장을 금지한다는 명을 내리셨지. 앞으로 우리나라의 발전이 기대 되는구먼.","choices":["병부와 상대등을 설치하였다.","백제 비유왕과 동맹을 체결하였다.","이사부를 보내 우산국을 복속시켰다.","매소성 전투에서 당의 군대를 격파하였다.","김흠돌의 난을 진압하고 귀족들을 숙청하였다."],"theme":"지증왕의 개혁","clues":["국호를 신라로 확정하고 왕호를 사용하며 순장을 금지한 왕은 지증왕입니다.","지증왕은 우산국 복속과 우경 장려 등의 정책을 추진했습니다."],"conclusion":"정답은 ③ 이사부를 보내 우산국을 복속시킨 사실입니다.","explanations":["병부 설치와 율령 반포는 법흥왕의 업적입니다.","백제 비유왕과 나제 동맹을 체결한 왕은 눌지왕입니다.","이사부의 우산국 복속(512년)은 지증왕 때입니다.","매소성 전투는 문무왕 때 나당 전쟁의 사건입니다.","김흠돌의 난 진압은 신문왕의 업적입니다."]},{"id":"71-8","exam":71,"number":8,"era":1,"answer":1,"score":3,"prompt":"다음 상황 이후에 전개된 사실로 옳은 것은? [3점]\n12월에 황제가 함원전에서 포로를 받아들였다. [황제가] 왕은\n정사를 자기가 한 것이 아니라 하였기에 용서하여 사평태상백\n원외동정으로 삼았다. 천남산은 사재소경으로, 승려 신성은\n은청광록대부로, 천남생은 우위대장군으로 삼았다. …… 천남건은\n검주(黔州)로 유배를 보냈다. 5부, 176성, 69만여 호를 나누어\n9도독부, 42주, 100현으로 만들고, 평양에 안동도호부를 두어 이를\n통치하게 하였다.\n- 『삼국사기』 -","choices":["안승이 보덕국왕으로 임명되었다.","을지문덕이 살수에서 대승을 거두었다.","김춘추가 당과의 군사 동맹을 성사시켰다.","의자왕이 윤충을 보내 대야성을 함락하였다.","연개소문이 정변을 일으켜 영류왕을 시해하였다."],"theme":"고구려 멸망 이후의 부흥 운동","clues":["연남건·연남생 등이 등장하고 안동도호부 설치가 언급된 사건은 고구려 멸망(668년)입니다.","고구려 멸망 뒤에는 신라와 당의 대립 및 고구려 부흥 운동이 이어졌습니다."],"conclusion":"정답은 ① 안승이 보덕국왕으로 임명된 사건입니다.","explanations":["안승의 보덕국왕 책봉은 고구려 멸망 이후 신라의 고구려 유민 포섭 정책과 관련됩니다.","살수 대첩(612년)은 고구려 멸망 이전입니다.","김춘추의 나당 동맹(648년)은 고구려 멸망 이전입니다.","의자왕 때 대야성 함락(642년)은 고구려 멸망 이전입니다.","연개소문의 정변(642년)은 고구려 멸망 이전입니다."]},{"id":"71-9","exam":71,"number":9,"era":3,"answer":2,"score":2,"prompt":"다음 사건이 일어난 시기를 연표에서 옳게 고른 것은? [2점]\n개원(開元) 20년에 발해가 천자의 조정을 원망하여 군사를\n거느리고 등주(登州)를 습격하여 자사 위준을 살해하였습니다. 이에\n황제께서 크게 노하여 하행성 등에게 군사를 징발하여 바다를 건너\n공격해 토벌하도록 명하였습니다. 아울러 당에 숙위하고 있던\n신라인 김사란을 귀국시켜 신라로 하여금 발해를 공격하도록\n하였습니다. …… 겨울은 깊어 가고 눈이 많이 내려 신라와 당의\n군대가 추위에 고생하므로 회군을 명령하였습니다.\n(가) (나) (다) (라) (마)\n발해 건국\n무왕 즉위\n문왕 상경 천도\n선왕 즉위\n고려 건국\n발해 멸망","choices":["(가)","(나)","(다)","(라)","(마)"],"theme":"발해 무왕의 대외 정책","clues":["발해의 등주 공격은 무왕 시기(732년)에 일어났습니다.","장문휴가 당의 등주를 공격했고 당은 신라에 협공을 요청했습니다."],"conclusion":"정답은 ② (나), 무왕 즉위 이후~문왕 상경 천도 이전입니다.","explanations":["발해 건국~무왕 즉위 이전에는 등주 공격이 일어나지 않았습니다.","무왕 때 등주 공격(732)이 발생했습니다.","문왕 상경 천도 이후가 아니라 무왕 시기의 사건입니다.","선왕 즉위 이후가 아니라 무왕 시기의 사건입니다.","고려 건국 이후가 아니라 발해 무왕 때의 사건입니다."]},{"id":"71-10","exam":71,"number":10,"era":5,"answer":4,"score":1,"prompt":"다음 자료에 나타난 시기의 경제 상황으로 옳은 것은? [1점]\n왕이 제서(制書)를 내리기를, “백성을 부유하게 하고 국가를\n이롭게 하는 것으로 전화(錢貨)만큼 중요한 것이 없다. 서북의\n양조(兩朝)에서는 이를 행한 지 이미 오래되었으나 우리나라는 홀로\n아직 행하지 않고 있다. 이제 처음으로 화폐를 주조하는 법을\n제정하고, 이에 따라 주조한 동전 15,000관(貫)을 재추(宰樞)와 문무\n양반 및 군인에게 나누어 하사하여 화폐 사용의 시작점으로 삼고자\n한다. 전문(錢文)은 해동통보라고 한다.”라고 하였다.","choices":["송상이 전국 각지에 송방을 두었다.","감자, 고구마 등의 구황 작물이 재배되었다.","시장을 감독하는 관청인 동시전이 설치되었다.","예성강 하구의 벽란도가 국제 무역항으로 번성하였다.","설점수세제의 시행으로 민간의 광산 개발이 허용되었다."],"theme":"고려 숙종의 해동통보","clues":["해동통보 발행은 고려 숙종 때 주전도감을 설치하여 추진했습니다.","고려는 송·거란 등과 교역했으며 예성강 하구 벽란도가 국제 무역항으로 성장했습니다."],"conclusion":"정답은 ④ 벽란도의 국제 무역항 기능입니다.","explanations":["송상과 송방은 조선 후기의 상업 활동입니다.","감자·고구마 보급은 조선 후기의 작물 변화입니다.","동시전은 신라의 시장 감독 기구입니다.","고려의 벽란도는 송과 아라비아 상인 등이 왕래하던 국제 무역항입니다.","설점수세제는 조선 후기 민간 광산 개발과 관련됩니다."]},{"id":"71-11","exam":71,"number":11,"era":5,"answer":2,"score":3,"prompt":"(가), (나) 사이의 시기에 있었던 사실로 옳은 것은? [3점]\n(가) ‌ 처음으로 역분전을 정하였다. 통일할 때 조정의 관리들과 군사들\n에게 관계(官階)는 논하지 않고, 그 사람의 성품과 행동이 착하고\n악함과 공로가 크고 작음을 참작하여 차등 있게 주었다.\n(나) ‌ 12월에 문무 양반 및 군인들의 전시과를 개정하였다. 제1과는\n전지 100결, 시지 70결을 지급한다. …… 제18과는 전지 20결을\n지급한다. 이 한(限)에 들지 못한 자에게는 모두 전지 17결을\n주기로 하고 이것을 통상의 법식으로 한다.","choices":["경기에 한하여 과전법이 실시되었다.","쌍기의 건의로 과거제가 시행되었다.","신돈이 전민변정도감의 책임자가 되었다.","만적이 개경에서 노비를 모아 반란을 모의하였다.","최충헌이 봉사 10조를 올려 시정 개혁을 건의하였다."],"theme":"역분전부터 전시과 개정 사이 제도","clues":["역분전은 태조 때(940년) 공로 등에 따라 지급했습니다.","문무 양반과 군인 대상 전시과 개정은 문종 때의 경정 전시과(1076년)입니다."],"conclusion":"정답은 ② 쌍기의 건의로 과거제가 시행됐습니다.","explanations":["과전법은 고려 말 1391년에 시행됐습니다.","광종은 쌍기의 건의로 958년 과거제를 실시했습니다.","신돈의 전민변정도감 개혁은 공민왕 시기입니다.", 이 담긴 시가 쓰여 있습니다.","choices":["수도의 행정과 치안을 담당하였다.","흥선 대원군이 집권한 시기에 혁파되었다.","국왕 직속 사법 기구로 반역죄 등을 다루었다.","5품 이하의 관리 임명에 대한 서경권을 행사하였다.","도승지를 수장으로 좌승지, 우승지 등의 관직을 두었다."],"theme":"비변사의 기능과 폐지","clues":["비국·주사는 비변사를 가리키며 중종 때 국방 문제 대응 기구로 등장했습니다.","비변사는 임진왜란 이후 최고 권력 기구로 확대되었다가 흥선 대원군 때 폐지됐습니다."],"conclusion":"정답은 ② 흥선 대원군 집권기에 혁파됐습니다.","explanations":["수도 행정·치안 담당은 한성부의 역할입니다.","흥선 대원군은 비변사를 폐지하고 의정부와 삼군부의 기능을 회복시켰습니다.","국왕 직속 사법 기구는 의금부입니다.","서경권은 사헌부·사간원 등 대간의 권한입니다.","도승지 등 6승지는 승정원의 관직입니다."]},{"id":"71-21","exam":71,"number":21,"era":9,"answer":3,"score":2,"prompt":"밑줄 그은 ‘이 사건’에 대한 설명으로 옳은 것은? [2점]\n이곳은 이언적의 위패를 모신 경주 옥산서원입니다. 이언적은 이른바 대윤과 소윤이라는 정치 세력 간의 갈등으로 윤임 등 대윤 세력이 탄압받은 이 사건 당시 관련자들의 처리를 두고 갈등이 생기자 스스로 관직에서 물러났습니다. 이후 양재역 벽서 사건에 연루되어 유배되었습니다.","choices":["김종직의 조의제문이 발단이 되었다.","폐비 윤씨 사사 사건이 원인이 되었다.","왕실 외척 간의 권력 다툼으로 일어났다.","진성 대군이 왕으로 즉위하는 결과를 가져왔다.","조광조 등이 반정 공신의 위훈 삭제를 주장하였다."],"theme":"을사사화의 발생과 영향","clues":["대윤과 소윤의 권력 다툼 및 윤임 탄압은 명종 즉위 직후 을사사화(1545년)입니다.","왕실 외척 간 권력 다툼으로 사림이 피해를 입었습니다."],"conclusion":"정답은 ③ 왕실 외척 간 권력 다툼입니다.","explanations":["김종직의 조의제문이 발단인 것은 무오사화(1498년)입니다.","폐비 윤씨 사사 문제는 갑자사화(1504년)의 원인입니다.","을사사화는 대윤 윤임과 소윤 윤원형 등 외척 간의 갈등입니다.","진성대군(중종) 즉위는 중종반정(1506년) 결과입니다.","조광조 등의 위훈 삭제 요구는 기묘사화(1519년)와 관련됩니다."]},{"id":"71-22","exam":71,"number":22,"era":10,"answer":5,"score":2,"prompt":"(가), (나) 사이의 시기에 있었던 사실로 옳은 것은? [2점]\n(가) ‌ 임금이 여러 도(道)에 명을 내렸다. “나라의 운세가 매우 좋지\n않아 역적 이괄이 군사를 일으켰는데, 여러 장수들이 좌시하여\n수도가 함락되고 말았다. …… 예로부터 반역은 어느 시대에나\n있었지만, 이처럼 극도로 흉악한 역적은 없었다. 종사와 자전*을\n염려하여 남쪽으로 피란하기로 결정하였다.”\n(나) ‌ 정명수가 심양에 있는 소현 세자의 관소에 와서 용골대의 뜻을\n전하기를, “세자가 이곳에 들어온 지가 이미 5년이 되었으니, 어찌\n스스로 먹고살 길을 마련하지 않는가. 세자와 인질들에게 어찌\n먹고살 식량을 늘 지급해 줄 수가 있겠는가. 경작할 땅을 주어\n내년부터 각자 농사를 지어 먹도록 함이 마땅하다.”라고 하였다.\n*자전(慈殿): 임금의 어머니","choices":["정문부가 길주에서 의병을 이끌었다.","삼수병으로 구성된 훈련도감이 설치되었다.","영창 대군이 사사되고 인목 대비가 유폐되었다.","이덕형이 구원병 요청을 위해 명에 청원사로 파견되었다.","김상헌 등이 남한산성에서 화의에 반대하여 항전을 주장하였다."],"theme":"이괄의 난과 병자호란 사이 사건","clues":["이괄의 난은 인조 집권 초기인 1624년, 소현 세자가 심양에 억류된 시기는 병자호란(1636) 이후입니다.","김상헌 등 척화파가 남한산성에서 항전을 주장한 병자호란은 두 사건 사이입니다."],"conclusion":"정답은 ⑤ 김상헌 등의 척화 항전 주장입니다.","explanations":["정문부의 북관대첩은 임진왜란 때입니다.","훈련도감 설치는 임진왜란 중 1593년입니다.","영창대군 사사·인목대비 유폐는 광해군 때입니다.","이덕형의 명나라 구원 요청은 임진왜란 때입니다.","김상헌 등은 병자호란 당시 남한산성에서 화의에 반대했습니다."]},{"id":"71-23","exam":71,"number":23,"era":10,"answer":3,"score":2,"prompt":"다음 자료를 활용한 탐구 활동으로 가장 적절한 것은? [2점]\n좌의정 채제공이 왕에게 아뢰었다. “빈둥거리는 무뢰배가\n삼삼오오 떼를 지어 스스로 상점을 개설하고 일용품을 거래하는\n일이 많아졌습니다. 그들은 큰 물건에서 작은 물건까지 싼값에\n억지로 사들이기 일쑤입니다. 혹 물건 주인이 말을 듣지 않으면\n난전(亂廛)으로 몰아서 결박하여 형조와 한성부로 끌고 가 혹독한\n형벌을 당하도록 합니다. 이 때문에 물건 주인은 본전에서\n밑지더라도 어쩔 수 없이 팔고 갑니다. 그리고 무뢰배들은 제각기\n가게를 벌여놓고 배나 되는 값을 받습니다. 어쩔 수 없이 사야 하는\n사람은 그 가게 외에서는 물건을 구할 수 없기 때문에, 물건 값이\n날마다 치솟고 있습니다.”","choices":["계해약조의 체결 과정을 확인한다.","오가작통법의 실시 목적을 파악한다.","신해통공을 단행하게 된 배경을 조사한다.","토지 소유자에게 결작을 부과한 이유를 살펴본다.","풍흉에 따라 전세를 차등 부과하는 기준을 알아본다."],"theme":"정조의 신해통공","clues":["채제공의 시전 상인 독점 폐해 건의는 정조 시기 상업 개혁과 관련됩니다.","정조는 1791년 신해통공으로 육의전을 제외한 시전 상인의 금난전권을 폐지했습니다."],"conclusion":"정답은 ③ 신해통공 시행 배경 조사입니다.","explanations":["계해약조는 세종 때 조일 교역 제한 약조입니다.","오가작통법은 주민 통제와 공동 책임 제도입니다.","시전 독점의 폐단 해결이 정조의 신해통공(1791)의 배경입니다.","결작은 균역법 보완 재원입니다.","풍흉에 따라 전세를 정한 것은 세종 때 연분 구등법과 관련됩니다."]},{"id":"71-24","exam":71,"number":24,"era":10,"answer":4,"score":2,"prompt":"밑줄 그은 ‘이 왕’의 재위 시기에 있었던 사실로 옳은 것은?\n[2점]\n이것은 조선과 청 사이의 경계를 나타내고자 세운 비석의 탁본입니다. 비석에 대해 자세히 설명해 주시 겠어요?\n이 비석은 국경을 분명히 하기 위해 청에서 파견한 오라총관 목극등과 이 왕이 보낸 조선의 관리들이 현지를 답사하고 세웠습니다. 비석에는 서쪽은 압록강, 동쪽은 토문강을 경계로 한다는 내용이 새겨져 있습니다.","choices":["최제우가 혹세무민의 죄로 처형되었다.","변급, 신류 등이 나선 정벌에 참여하였다.","국왕의 친위 부대인 장용영이 창설되었다.","경신환국 등 여러 차례 환국이 발생하였다.","정여립 모반 사건을 빌미로 기축옥사가 일어났다."],"theme":"숙종의 백두산정계비와 환국","clues":["목극등의 국경 조사와 토문강 표기는 숙종 때 백두산정계비(1712)입니다.","숙종 때 경신·기사·갑술환국 등 여러 차례 환국이 발생했습니다."],"conclusion":"정답은 ④ 경신환국 등 환국 발생입니다.","explanations":["최제우 처형은 고종 때 1864년입니다.","변급·신류의 나선 정벌은 효종 때입니다.","장용영 창설은 정조 때입니다.","숙종 시기 경신·기사·갑술환국 등 정치 세력이 교체됐습니다.","정여립 사건의 기축옥사는 선조 때입니다."]},{"id":"71-25","exam":71,"number":25,"era":10,"answer":2,"score":2,"prompt":"밑줄 그은 ‘이 인물’에 대한 설명으로 옳은 것은? [2점]\n이것은 이 인물이 제주도 유배지에서 부인에게 보낸 한글 편지입니다. 편지에는 유배 생활의 곤궁함과 함께 위독한 부인에 대한 걱정과 그리움이 담겨 있습니다. 독창적인 서체로 유명한 이 인물은 유배지에서 세한도를 그리기도 하였습니다.","choices":["기대승과 사단칠정 논쟁을 전개하였다.","북한산비가 진흥왕 순수비임을 고증하였다.","양명학을 연구하여 강화학파를 형성하였다.","청으로부터 시헌력을 도입하자고 건의하였다.","열하일기에서 수레와 선박의 사용을 강조하였다."],"theme":"김정희의 세한도와 북한산비 고증","clues":["제주 유배 중 세한도를 그린 추사 김정희는 조선 후기의 학자·서예가입니다.","김정희는 북한산비가 신라 진흥왕 순수비임을 고증했습니다."],"conclusion":"정답은 ② 진흥왕 순수비 고증입니다.","explanations":["기대승과 사단칠정 논쟁을 한 인물은 이황입니다.","김정희는 북한산비를 진흥왕 순수비로 고증했습니다.","강화학파를 형성한 양명학자는 정제두입니다.","시헌력 도입 건의는 김육과 관련됩니다.","열하일기 저자는 박지원입니다."]},{"id":"71-27","exam":71,"number":27,"era":10,"answer":5,"score":2,"prompt":"밑줄 그은 ‘이 시기’에 있었던 사실로 옳은 것은? [2점]\n이 우표 속 그림은 국왕의 혼인을 축하하기 위해 거행된 진하례 모습을 그린 궁중 행사도입니다. 그림에 보이는 왕실 행사의 화려함과는 달리 안동 김씨 등 외척 세력이 세 왕에 걸쳐 60여 년 동안 권력을 잡은 이 시기에는 국왕의 실권이 많이 위축되었습니다.","choices":["어영청을 중심으로 북벌이 추진되었다.","윤지충 등이 처형된 신해박해가 일어났다.","이필제가 영해 지역을 중심으로 난을 일으켰다.","경복궁 중건 비용 마련을 위해 당백전이 발행되었다.","삼정의 문란을 해결하기 위해 삼정이정청이 설치되었다."],"theme":"안동 김씨 세도 정치기의 사건","clues":["안동 김씨 등 외척이 3대 약 60년 권력을 장악한 시기는 순조·헌종·철종의 세도 정치기입니다.","철종 때 삼정의 문란으로 임술 농민 봉기가 일어나 삼정이정청이 설치됐습니다."],"conclusion":"정답은 ⑤ 삼정이정청 설치입니다.","explanations":["어영청을 통한 북벌 추진은 효종 시기의 일입니다.","신해박해는 정조 때인 1791년입니다.","이필제의 난은 고종 때인 1871년입니다.","당백전 발행은 흥선 대원군 집권기의 정책입니다.","삼정이정청 설치는 철종 때 임술 농민 봉기의 후속 조치입니다."]},{"id":"71-30","exam":71,"number":30,"era":10,"answer":1,"score":2,"prompt":"(가)에 대한 설명으로 옳은 것은? [2점]\n오전 11:00 100%\n한국의 무형문화유산 - (가)\n史 한국사 알림이 채널 조회 수 202,408\n궁중 무용 중 유일하게 사람 형상의 가면을 쓰고\n추는 춤으로 5명이 중앙과 동서남북을 상징하는\n5가지 색깔의 옷을 입고 춤을 춥니다. 가면의\n팥죽색은 악귀를 물리치는 벽사의 의미를 담고\n있습니다. 2009년 ‘유네스코 무형문화유산’으로\n등재되었습니다.","choices":["처용 설화를 바탕으로 하였다.","종묘에서 행하는 제향 의식이다.","부처의 영취산 설법 모습을 재현하였다.","창과 아니리, 너름새 등으로 구성되었다.","양반, 파계승 등을 풍자하는 내용이 담겨 있다."],"theme":"처용무의 특징","clues":["다섯 사람이 동서남북·중앙을 상징하는 색의 옷을 입고 가면을 쓰는 궁중 무용은 처용무입니다.","처용무는 처용 설화에서 유래했고 유네스코 인류무형문화유산으로 등재됐습니다."],"conclusion":"정답은 ① 처용 설화 기반입니다.","explanations":["처용무는 역신을 물리치는 처용 설화를 바탕으로 형성된 궁중 무용입니다." 한다."],"theme":"고조선의 발전과 멸망","clues":["범금 8조, 한 무제와의 대립, 왕검성은 고조선을 가리킵니다.","고조선은 중국과 한반도 남부 사이의 중계 무역으로 성장했습니다."],"conclusion":"정답은 ③ 왕검성의 위치를 탐구하는 활동입니다.","explanations":["임신서기석은 신라의 유교 문화와 관련됩니다.","칠지도는 백제와 왜의 교류를 보여 줍니다.","왕검성은 고조선의 수도이며 한의 침공과 멸망 과정에서 등장합니다.","동맹은 고구려의 제천 행사입니다.","화백 회의는 신라의 귀족 회의입니다."]},{"id":"72-3","exam":72,"number":3,"era":1,"answer":2,"score":2,"prompt":"(가), (나) 사이의 시기에 있었던 사실로 옳은 것은? [2점]\n(가) ‌ 겨울에 백제왕이 태자와 함께 정병 3만 명을 거느리고\n고구려를 침입하여 평양성을 공격하였다. 고구려왕 사유가\n힘껏 싸우며 막다가 날아오는 화살을 맞고 죽었다.\n(나) ‌ 정월에 백제는 고구려의 도살성을 쳐서 빼앗았다. 3월에는\n고구려가 백제의 금현성을 함락시켰다. 신라왕이 양국의\n병사가 지친 틈을 타 이찬 이사부에게 명하여 병사를 내어 쳐서\n두 성을 빼앗아 증축하고 갑사 1천 명을 두어 지키게 하였다.","choices":["신라가 기벌포에서 당군을 격파하였다.","고구려가 국내성에서 평양으로 천도하였다.","계백이 이끈 결사대가 황산벌에서 패배하였다.","연개소문이 정변을 일으켜 권력을 장악하였다.","김춘추가 당으로 건너가 군사 동맹을 체결하였다."],"theme":"삼국의 항쟁: 근초고왕~진흥왕","clues":["(가)는 근초고왕이 고국원왕을 전사시킨 371년 사건입니다.","(나)는 진흥왕 시기에 신라가 도살성과 금현성을 차지한 6세기 사건입니다."],"conclusion":"정답은 ② 고구려의 평양 천도입니다.","explanations":["기벌포 전투(676년)는 (나) 이후입니다.","장수왕의 평양 천도(427년)는 (가)와 (나) 사이입니다.","황산벌 전투(660년)는 (나) 이후입니다.","연개소문 정변(642년)은 (나) 이후입니다.","김춘추의 나당 동맹(648년)은 (나) 이후입니다."]},{"id":"72-11","exam":72,"number":11,"era":5,"answer":5,"score":2,"prompt":"다음 검색창에 들어갈 왕의 재위 기간에 있었던 사실로 옳은\n것은? [2점]\n한국사 사료 모음\n고려 시대 고려사 검색 결과\n고려사\n사료 목록 검색\n시 기 내 용 원문 이미지\n2년 처음으로 12목을 설치하다\n5년 흑창을 의창으로 고치다\n6년 면천된 노비가 주인을 욕하면 환천하게 하다\n11년 개경에 국자감을 두다","choices":["관학을 진흥하고자 양현고를 설치하였다.","광덕, 준풍 등의 독자적 연호를 사용하였다.","주전도감을 설치하여 해동통보를 발행하였다.","정계와 계백료서를 지어 관리의 규범을 제시하였다.","최승로의 시무 28조를 받아들여 통치 체제를 정비하였다."],"theme":"성종의 지방 통치 체제와 시무 28조","clues":["12목 설치, 흑창을 의창으로 개편하고 국자감을 설치한 왕은 고려 성종입니다.","성종은 최승로의 시무 28조를 수용하여 유교적 통치 체제를 정비했습니다."],"conclusion":"정답은 ⑤ 최승로의 시무 28조 수용입니다.","explanations":["양현고 설치는 고려 예종 때 관학 진흥과 관련됩니다.","광덕·준풍 연호는 고려 광종 때입니다.","주전도감 설치와 해동통보 발행은 숙종 때입니다.","정계·계백료서는 태조 왕건의 훈계 문서입니다.","성종은 최승로의 시무 28조를 받아들여 제도를 정비했습니다."]},{"id":"72-12","exam":72,"number":12,"era":5,"answer":3,"score":2,"prompt":"(가)에 대한 고려의 대응으로 옳은 것은? [2점]\n이 자료는 초조대장경의 일부입니다. (가) 의 침입으로 현종이 피란을 가고 개경이 함락되자 부처의 힘으로 나라를 지키려는 마음을 담아 조판하기 시작하였습니다.","choices":["윤관을 보내 동북 9성을 개척하였다.","화통도감을 두어 화포를 제작하였다.","광군을 조직하여 침입에 대비하였다.","박위를 파견하여 근거지를 토벌하였다.","철령위 설치에 반발해 요동 정벌을 추진하였다."],"theme":"거란 침입과 초조대장경 조판","clues":["현종의 피란과 개경 함락을 계기로 초조대장경을 조판하기 시작한 침입 세력은 거란입니다.","거란 침입에 대비해 고려는 광군을 조직했습니다."],"conclusion":"정답은 ③ 광군 조직입니다.","explanations":["윤관의 동북 9성 개척은 여진 정벌과 관련됩니다.","화통도감은 고려 말 왜구 격퇴에 쓰일 화약 무기를 개발하려고 설치했습니다.","광군은 고려 초기 거란 침입에 대비한 군사 조직입니다.","박위의 쓰시마섬 정벌은 고려 말 왜구 문제와 관련됩니다.","철령위 설치 반발과 요동 정벌은 고려 말 원·명 교체기 사건입니다."]},{"id":"72-13","exam":72,"number":13,"era":6,"answer":2,"score":2,"prompt":"(가)에 들어갈 내용으로 적절한 것은? [2점]\n한국사 대화형 인공지능\nQ 그림 속 인물에 대해 알려줘.\nA 숙종 대 과거에 합격하여 의종 대\n까지 활동한 대표적인 고려 유학자\n입니다.\nQ 그의 대표적인 활동에 대해 알려줘.\nA 유교 사관을 바탕으로 삼국의\n역사를 기록한 삼국사기의 편찬을\n총괄하였습니다.\nQ 다른 행적에 대해서도 알려줘.\nA (가)","choices":["봉사 10조를 국왕에게 올렸습니다.","관군을 이끌고 묘청의 난을 진압하였습니다.","만권당에서 원의 유학자들과 교유하였습니다.","불씨잡변을 저술하여 불교를 비판하였습니다.","9재 학당을 설립하여 유학 교육에 힘썼습니다."],"theme":"김부식과 묘청의 난 진압","clues":["유교 사관으로 삼국사기를 편찬한 고려 문신은 김부식입니다.","김부식은 묘청의 서경 천도 운동과 난을 진압했습니다."],"conclusion":"정답은 ② 묘청의 난을 진압했습니다.","explanations":["봉사 10조는 무신 집권자 최충헌의 개혁 건의입니다.","김부식은 관군을 이끌고 1135년 묘청의 난을 진압했습니다.","만권당에서 원 문인과 교유한 사람은 이제현입니다.","불씨잡변 저자는 조선 초기 정도전입니다.","9재 학당을 세운 사람은 해동공자 최충입니다."]},{"id":"72-14","exam":72,"number":14,"era":7,"answer":4,"score":3,"prompt":"(가)~(다)를 일어난 순서대로 옳게 나열한 것은? [3점]\n(가) ‌ 왕이 먼저 나라 안의 신하들을 권유하여 개경으로 환도하게\n하였다. 여러 신하들이 말하기를 “임금의 명령인데, 감히 따르지\n않을 수 있겠는가?”라고 하였으므로, 임유무가 화가 나서\n어떻게 해야 할지를 알지 못하였다.\n(나) ‌ 조위총이 군사를 일으키자, 이의방이 이의민을 정동 대장군\n지병마사로 임명하였다. 이의민이 군사를 거느리고 전투에\n나섰다가 날아오는 화살에 눈을 맞았으나, 철령으로 진군하여\n사방에서 북을 치고 고함을 지르면서 급습하여 크게 격파\n하였다.\n(다) ‌ 백관이 최우의 집에 나아가 정년도목(政年都目)을 올렸다.\n최우가 청사에 앉아 그것을 받았다. 6품 이하는 당하(堂下)에서\n두 번 절하고 땅에 엎드려 감히 고개를 들고 보지 못하였다.\n이때부터 최우는 정방을 그의 집에 두고 백관의 인사 행정을\n처리하였다.","choices":["(가) - (나) - (다)","(가) - (다) - (나)","(나) - (가) - (다)","(나) - (다) - (가)","(다) - (나) - (가)"],"theme":"무신 정권기 주요 사건의 순서","clues":["조위총의 난은 1174년, 최우의 정방 설치는 1225년, 개경 환도는 1270년입니다.","인물·사건이 같아 보여도 강화 천도·개경 환도 시점을 구별해야 합니다."],"conclusion":"정답은 ④ (나)→(다)→(가)입니다.","explanations":["개경 환도(1270)를 조위총의 난보다 앞에 두어 틀렸습니다.","개경 환도(1270)를 최우의 정방 설치보다 앞에 두어 틀렸습니다.","개경 환도(1270)를 정방 설치(1225)보다 앞에 두어 틀렸습니다.","조위총의 난(1174)→정방 설치(1225)→개경 환도(1270)가 옳습니다.","정방 설치를 조위총의 난보다 앞세워 틀렸습니다."]},{"id":"72-15","exam":72,"number":15,"era":8,"answer":1,"score":2,"prompt":"밑줄 그은 ‘시기’의 사실로 옳은 것은? [2점]\n이 그림은 공민왕과 그의 왕비인 노국 대장 공주의 초상화야. 고려에는 노국 대장 공주 외에도 제국 대장 공주, 계국 대장 공주 등 원 출신의 왕비들이 여럿 있었어.\n맞아. 충렬왕부터 공민왕에 이르는 시기의 왕들은 원의 공주들과 결혼했어.","choices":["권문세족이 도평의사사를 장악하였다.","왕조 교체를 예언하는 정감록이 유포되었다.","강조가 정변을 일으켜 김치양을 제거하였다.","김보당이 의종 복위를 주장하며 난을 일으켰다.","국정을 총괄하는 기구로 교정도감이 설치되었다."],"theme":"고려 원 간섭기의 권문세족","clues":["충렬왕부터 공민왕에 이르는 시기의 원 공주와 혼인은 원 간섭기 특징입니다.","이 시기 권문세족은 도평의사사를 장악해 권력을 행사했습니다."],"conclusion":"정답은 ① 권문세족의 도평의사사 장악입니다.","explanations":["원 간섭기에 권문세족은 도평의사사를 장악했습니다.","정감록은 조선 후기에 널리 유포된 비기입니다.","강조의 정변은 1009년 고려 목종 때입니다.","김보당의 난은 무신 정권 초기 사건입니다.","교정도감은 최충헌이 무신 정권기에 설치한 기구입니다."]},{"id":"72-16","exam":72,"number":16,"era":5,"answer":3,"score":2,"prompt":"(가) 국가의 경제 상황으로 옳은 것은? [2점]\n이달의 책\n1123년 송 사절의 한 사람으로\n(가) 에 왔던 서긍이 지은\n책입니다. 이 책은 서긍이 예성항을\n통해 개경으로 들어와 한 달 남짓\n머물며 보고 들은 (가) 의\n다양한 모습을 그림을 곁들여 설명한\n것입니다. 현재 남아 있는 판본들은,\n그림[圖]은 없어지고 글[經]만 남아\n있습니다.","choices":["솔빈부의 말이 특산품으로 유명하였다.","송상이 전국 각지에 송방을 설치하였다.","서적점, 다점 등의 관영 상점을 운영하였다.","집집마다 부경이라고 불리는 창고가 있었다.","광산을 전문적으로 경영하는 덕대가 나타났다."],"theme":"고려도경과 고려 경제","clues":["1123년 송 사신 서긍의 고려도경은 고려의 생활과 문화를 묘사합니다.","고려에는 서적점·다점 등 관영 상점이 운영됐습니다."],"conclusion":"정답은 ③ 서적점과 다점 운영입니다.","explanations":["솔빈부의 말은 발해의 특산품입니다.","송상·송방은 조선 후기 상업 활동입니다.","고려에는 서적점·다점 등 관영 상점이 있었습니다.","부경은 고구려의 가정 내 창고입니다.","덕대는 조선 후기 광산 경영자입니다."]},{"id":"72-18","exam":72,"number":18,"era":9,"answer":2,"score":2,"prompt":"밑줄 그은 ‘임금’에 대한 설명으로 옳은 것은? [2점]\n나도 들었네. 중전마마의 동생으로 임금께서 정도전을 숙청할 때 공을 세웠던 사람들 이었지.\n자네 들었는가? 임금께서 민무구, 민무질에게 자결을 명하셨다더군. 몇 해 전 어린 세자를 이용해 권세를 잡으려 했다는 죄로 귀양을 보내셨었지.","choices":["공신들에게 역분전을 지급하였다.","주자소를 두어 계미자를 주조하였다.","정치도감을 설치하여 개혁을 추진하였다.","구황촬요를 간행하여 기근에 대비하였다.","유자광의 고변을 계기로 남이를 처형하였다."],"theme":"태종과 왕비 민씨 형제 숙청","clues":["민무구·민무질은 태종의 처남이며, 태종이 왕권 강화를 위해 숙청했습니다.","태종은 주자소를 설치하고 계미자(1403)를 주조했습니다."],"conclusion":"정답은 ② 주자소 설치와 계미자 주조입니다.","explanations":["역분전 지급은 고려 태조 왕건 때입니다.","태종은 주자소를 설치해 계미자를 만들었습니다.","정치도감은 고려 충목왕 때 설치했습니다.","구황촬요는 조선 명종 때 간행됐습니다.","남이의 옥사는 조선 예종 때 발생했습니다."]},{"id":"72-19","exam":72,"number":19,"era":9,"answer":4,"score":3,"prompt":"(가) 기구에 대한 설명으로 옳은 것은? [3점]\n도로명으로 보는 역사 : 만리재로\n이 도로명은 만리재에서 유래한 것이다.\n만리재는 조선의 문신 최만리가 살았다고 하여\n만리재로\nManrijae-ro\n붙여진 지명이다. 세자의 스승이기도 하였던\n최만리는 세종이 학문 연구, 편찬 사업 등을\n수행하도록 설치한 (가) 의 부제학으로 활약하였다. 그러나\n훈민정음 창제를 반대하는 상소를 올려 세종과 갈등을 빚기도 하였다.","choices":["은대(銀臺)라고도 불렸다.","전문 강좌인 7재를 운영하였다.","고려의 삼사와 같은 기능을 수행하였다.","단종 복위 운동을 계기로 세조에 의해 폐지되었다.","대사성을 수장으로 좨주, 직강 등의 관직을 두었다."],"theme":"세종의 집현전과 폐지","clues":["최만리는 세종 때 집현전 부제학으로 훈민정음 창제에 반대하는 상소를 올렸습니다.","집현전은 세조 때 사육신의 단종 복위 운동 이후 폐지됐습니다."],"conclusion":"정답은 ④ 단종 복위 운동을 계기로 폐지됐습니다.","explanations":["은대는 승정원을 가리키는 별칭입니다.","국자감의 7재는 고려 예종 때입니다.","고려 삼사는 회계 업무를 담당하므로 집현전과 다릅니다.","세조는 사육신 사건 이후 집현전을 폐지했습니다.","대사성은 성균관의 수장입니다."]},{"id":"72-20","exam":72,"number":20,"era":9,"answer":2,"score":2,"prompt":"밑줄 그은 ‘전하’의 재위 기간에 있었던 사실로 옳은 것은? [2점]\n전하께서 성군을 이으셨으니, 예악(禮樂)으로 태평 시절을\n일으키실 때가 바로 지금이다. 장악원 소장의 의궤와 악보가 오랜\n세월이 지나서 끊어지고 문드러졌다. 다행히 보존된 것 역시 모두\n엉성하고 오류가 있으며 빠진 것이 많다. 이에 성현 등에게 명하여\n다시 교정하게 하였다. 책이 완성되자 악학궤범이라고 이름 지었다.","choices":["예악을 정리한 가례집람이 저술되었다.","국가의 기본 법전인 경국대전이 완성되었다.","외교 문서를 집대성한 동문휘고가 편찬되었다.","붕당의 폐해를 경계하기 위한 탕평비가 건립되었다.","이조 전랑 임명을 둘러싸고 김효원과 심의겸이 대립하였다."],"theme":"성종 때 악학궤범과 경국대전","clues":["성현 등에게 악학궤범 편찬을 명한 왕은 성종입니다.","경국대전은 성종 때 완성·반포되어 조선의 기본 법전이 됐습니다."],"conclusion":"정답은 ② 경국대전 완성입니다.","explanations":["가례집람은 조선 후기 김장생의 예학 저술입니다.","경국대전 완성은 성종 때의 일입니다.","동문휘고는 조선 정조 때 외교 문서를 모아 편찬한 책입니다.","탕평비 건립은 영조 때입니다.","김효원과 심의겸의 대립은 선조 때 동인·서인 분화의 계기입니다."]},{"id":"72-22","exam":72,"number":22,"era":10,"answer":5,"score":2,"prompt":"(가) 사절단에 대한 설명으로 옳은 것은? [2점]\n그림으로 보는 조선 사절단의 여정\n『사로승구도』는 1748 를 파괴하였다."],"theme":"동학 농민군의 황룡촌 전투","clues":["부안 백산·장성 황룡 전적·공주 우금치는 동학 농민 운동 답사 경로입니다.","장성 황룡촌 전투에서 농민군은 홍계훈의 관군에 승리했습니다."],"conclusion":"정답은 ③ 홍계훈 관군 격파입니다.","explanations":["전주 화약은 황룡촌 전투 이후 전주성 점령 뒤에 체결됐습니다.","최제우 처형은 1864년으로 동학 농민 운동보다 앞섭니다.","장성 황룡촌 전투에서 농민군은 홍계훈의 관군에 승리했습니다.","전봉준 체포는 농민군의 우금치 패배 이후입니다.","만석보 파괴와 고부 농민 봉기는 황룡촌 전투 이전입니다."]},{"id":"72-34","exam":72,"number":34,"era":12,"answer":1,"score":2,"prompt":"밑줄 그은 ‘이 시기’의 의병 활동에 대한 설명으로 옳은 것은?\n[2점]\n이곳 지리산 연곡사에는 의병장 고광순의 순절비가 있습니다. 그는 지리산을 중심으로 장기 항전을 계획하다가 일본군의 토벌 작전으로 순국하였습니다. 고종의 강제 퇴위와 군대의 강제 해산으로 의병 활동이 고조된 이 시기에는 고광순을 비롯하여 각계각층의 사람들이 국권 회복을 위해 활동했습니다.","choices":["13도 창의군을 결성하였다.","한중 연합 전선을 형성하였다.","최익현이 태인에서 궐기하였다.","고경명 등이 의병장으로 활약하였다.","봉오동 전투에서 일본군을 격퇴하였다."],"theme":"정미의병과 13도 창의군","clues":["고종 강제 퇴위와 군대 해산(1907)은 정미의병이 확산되는 계기가 됐습니다.","이인영·허위 등은 13도 창의군을 결성해 서울 진공 작전을 계획했습니다."],"conclusion":"정답은 ① 13도 창의군 결성입니다.","explanations":["13도 창의군은 정미의병 시기 조직됐습니다.","한중 연합 전선은 1930년대 만주 독립군 활동과 관련됩니다.","최익현의 태인 의병은 을사의병(1906)입니다.","고경명 의병은 임진왜란 때의 활동입니다.","봉오동 전투는 1920년 독립 전쟁의 성과입니다."]},{"id":"72-35","exam":72,"number":35,"era":12,"answer":5,"score":2,"prompt":"밑줄 그은 ‘개혁’의 내용으로 옳은 것은? [2점]\n덕수궁 내에 있는 정관헌은 전통 건축 양식에 근대적 요소를 결합한 것으로 평가받고 있습니다. 고종이 황제로 즉위한 후 구본신참을 바탕으로 개혁을 추진할 때 건립되었습니다.","choices":["홍범 14조를 반포하였다.","공사 노비법을 혁파하였다.","신식 군대인 별기군을 창설하였다.","근대 교육 기관인 육영 공원을 설립하였다.","지계아문을 설치하여 토지 소유자에게 지계를 발급하였다."],"theme":"광무개혁과 지계 발급","clues":["고종의 황제 즉위 이후 구본신참에 기초한 개혁은 광무개혁입니다.","광무개혁은 지계아문을 두어 지계를 발급하고 토지 소유권을 확인하려 했습니다."],"conclusion":"정답은 ⑤ 지계아문의 지계 발급입니다.","explanations":["홍범 14조는 제2차 갑오개혁의 내용입니다.","공사 노비법 혁파는 제1차 갑오개혁입니다.","별기군 창설은 1881년 개화 정책의 일부입니다.","육영공원 설립은 1886년입니다.","지계아문 설치와 지계 발급은 대한제국 광무개혁의 특징입니다."]},{"id":"72-36","exam":72,"number":36,"era":13,"answer":4,"score":1,"prompt":"(가) 운동에 대한 설명으로 옳은 것은? [1점]\n언론 보도로 본 만세 기념일\n3월 1일에 배화 여학교 학생 일동은 학교 동산에 올라가서 우리 독립 선언 기념을 경축하기 위하여 만세를 부르고, 배재 학교 생도 일동은 3월 1일에 일제히 결석하고 3월 2일에 등교하여 갑자기 그 학교 마당에서 만세를 불렀으니 …… 저와 같은 불미한 행동을 허락한 까닭으로 그 학교 교장들은 파직하고 심 answer":1,"score":2,"prompt":"다음 자료를 활용한 탐구 활동으로 가장 적절한 것은? [2점]\n처음에 공신 배극렴·조준·정도전이 세자를 세울 것을 청하면서,\n나이와 공로를 고려하여 정하기를 청하였다. 임금이 강씨를 중히\n여겨 이방번에게 뜻이 있었으나, 공신들은 방번이 적합하지 않다고\n생각하여 사적으로 서로 이야기하기를, “만일 강씨 소생이어야\n한다면 막내가 조금 낫겠다.”라고 하였다. 이후 임금이 “누가 세자가\n될 만한가?”라고 물으니, 맏아들 혹은 공로가 있는 사람을 세워야만\n된다고 간절히 말하는 사람이 없었다. 이에 극렴이 말하기를, “막내\n아들이 좋습니다.”라고 하니, 임금이 마침내 뜻을 결정하여 어린\n이방석을 왕세자로 삼았다.","choices":["제1차 왕자의 난이 일어난 이유를 찾아본다.","수양대군이 정권을 장악하는 과정을 조사한다.","사림이 동인과 서인으로 나뉘게 된 계기를 파악한다.","폐모살제 등을 구실로 반정을 일으킨 세력을 검색한다.","허적과 윤휴 등 남인이 대거 축출되는 사건을 알아본다."],"theme":"조선 태조와 왕자의 난","clues":["태조가 어린 이방석을 세자로 책봉한 결정은 태조 말 왕위 계승 갈등의 배경입니다.","1398년 이방원은 정도전 등을 제거하고 제1차 왕자의 난을 일으켰습니다."],"conclusion":"정답은 ① 제1차 왕자의 난의 배경입니다.","explanations":["이방석 세자 책봉은 제1차 왕자의 난의 중요한 배경입니다.","수양대군 정권 장악은 세조의 계유정난(1453년)입니다.","동인·서인 분화는 선조 때 사림 분열입니다.","폐모살제를 명분으로 한 인조반정은 1623년입니다.","허적·윤휴 등이 축출된 사건은 숙종 때 경신환국입니다."]},{"id":"75-20","exam":75,"number":20,"era":9,"answer":5,"score":2,"prompt":"(가) 기구에 대한 설명으로 옳은 것은? [2점]\n이 그림은 (가) 의 감찰인 김종한 등 23인의 계회를 기념하여 그린 이십삼상대회도입니다. ‘상대’는 백관에 대한 규찰과 탄핵 등을 관장하던\n(가) 의 별칭입니다. 이 계회도의 하단에는 감찰 23인의 품계와 성명, 그리고 그 부친의 관직과 성명 등이 기재되어 있어 조선 초기 계회도를 이해 하는 데 큰 도움이 됩니다.","choices":["수도의 행정과 치안을 담당하였다.","을묘왜변을 계기로 상설 기구화되었다.","서얼 출신 학자들이 검서관에 등용되었다.","역사서를 편찬하고 사고에 보관하는 일을 맡았다.","대사헌을 수장으로 집의, 장령 등의 관직을 두었다."],"theme":"사헌부의 기능과 관직","clues":["백관을 규찰·탄핵하는 상대는 조선의 사헌부 별칭입니다.","사헌부는 대사헌을 수장으로 집의·장령 등의 관직을 두었습니다."],"conclusion":"정답은 ⑤ 대사헌·집의·장령 등이 소속됐습니다.","explanations":["수도 행정과 치안은 한성부의 역할입니다.","을묘왜변을 계기로 비변사가 상설화됐습니다.","규장각 검서관은 정조 때 서얼 출신 학자들을 등용했습니다.","실록 편찬과 사고 보관은 춘추관과 관련됩니다.","사헌부는 대사헌을 수장으로 집의·장령 등이 소속됐습니다."]},{"id":"75-21","exam":75,"number":21,"era":9,"answer":2,"score":2,"prompt":"(가)에 대한 조선의 대응으로 옳은 것은? [2점]\n이 그림에는 1588년 북병사 장양공 이일이 변경을 침범하던 (가) 을/를 정벌하는 장면이 그려져 있습니다. 조선 초에는 (가) 을/를 회유하기 위해 경성과 경원에 무역소를 설치하기도 하였으나, 이들은 수시로 변경을 침범하였고 조선 정부의 토벌도 이어졌습니다.","choices":["사신 접대를 위해 한성에 동평관을 두었다.","두만강 일대를 개척하여 6진을 설치하였다.","강화도로 도읍을 옮겨 장기 항전을 준비하였다.","철령위 설치에 반발하여 요동 정벌을 추진하였다.","신기군, 신보군, 항마군 등으로 구성된 별무반을 조직하였다."],"theme":"조선의 여진에 대한 대응","clues":["1588년 이일이 북방에서 정벌한 세력은 여진입니다.","세종 때 김종서가 두만강 일대를 개척해 6진을 설치했습니다."],"conclusion":"정답은 ② 6진 설치입니다.","explanations":["동평관은 일본 사절 접대 시설입니다.","세종 때 두만강 일대에 6진을 설치해 여진에 대응했습니다.","강화도 천도는 고려가 몽골의 침입에 대응한 방식입니다.","철령위 문제와 요동 정벌은 고려 말 사건입니다.","별무반은 고려 숙종 때 여진 정벌군입니다."]},{"id":"75-22","exam":75,"number":22,"era":9,"answer":2,"score":3,"prompt":"(가), (나) 사이의 시기에 있었던 사실로 옳은 것은? [3점]\n(가) ‌ 대신 등에게 전교하기를, “조광조 등의 일은 내가 늘 마음속에서\n잊지 않았으나 선왕(先王)께서 전에 허락하지 않으셨으므로\n감히 가벼이 고치지 못하였다. 이제는 내 병이 위독하여 비로소\n유언하니 조광조 등의 벼슬을 모두 회복할 수 있으면 다행\n이겠다. 현량과도 회복하여 거두어 등용하도록 하라.”라고\n하였다.\n(나) ‌ 부제학 정언각이 아뢰기를, “소신이 양재역에 이르러서 벽에\n써 붙인 주서(朱書)를 보았는데 국가에 관계된 내용이었으므로\n지극히 놀랐습니다. …… 또 반역의 잔당들은 이미 죄를\n물었습니다만, 심영은 대왕대비를 가리켜 신하로서 할 수 없는\n말을 하였습니다. 신하가 그와 같은 말을 하고서 어떻게 천지\n사이에 용납될 수 있겠습니까.”라고 하였다.","choices":["자의 대비의 복상 문제로 예송이 일어났다.","외척 간의 권력 다툼으로 윤임이 제거되었다.","세자 책봉 문제를 계기로 정철이 유배되었다.","희빈 장씨 소생의 원자 책봉 문제로 환국이 발생하였다.","폐비 윤씨 사사 사건의 전말이 알려져 김굉필 등이 처형되었다."],"theme":"을사사화의 시기","clues":["(가)는 인종의 조광조 복권 유언(1545년), (나)는 양재역 벽서 사건(1547년)입니다.","명종 즉위 직후 을사사화(1545년)로 대윤 윤임이 제거됐습니다."],"conclusion":"정답은 ② 을사사화입니다.","explanations":["예송은 17세기 현종 때의 복상 논쟁입니다.","1545년 을사사화에서 윤임 등 대윤 세력이 제거됐습니다.","정철 유배는 선조 때의 건저의 사건과 관련됩니다.","원자 책봉 문제로 일어난 기사환국은 숙종 때입니다.","갑자사화는 연산군 때 폐비 윤씨 사사 문제가 원인이 됐습니다."]},{"id":"75-23","exam":75,"number":23,"era":10,"answer":2,"score":2,"prompt":"(가) 전쟁 중에 있었던 사실로 옳은 것은? [2점]\n상세 정보\n남한산성 무너진 날 죽었어야 할 몸인데 초수(楚囚)*되어 아직도 못 돌아간 신하라네\n[해설]\n이 작품은 송시열이 펴낸 『삼학사전』에\n서쪽으로 오며 형 생각에 몇 번이나\n수록된 시로, 오달제가 형과 아내에게\n눈물 뿌렸던고 동녘을 바라보니 아우 그린 형이 가련하네\n보낸 것입니다. 삼학사는 (가) 때\n척화론을 주장하다가 이듬해 심양으로\n…… 부부 은정(恩情) 중하기도 한데\n잡혀가 순절한 홍익한, 윤집, 오달제를\n말합니다.\n만난지 두 돌도 못 되었네그려\n『삼학사전』에는 삼학사의 절개와 비극적\n이제는 만 리 밖에 이별하여\n백년 가약이 헛되구나 길이 멀어 편지도 못 부치고 산이 높아 꿈조차 더디 넘네 나의 살 길 기약할 수 없으니 뱃속의 아이나 잘 보살펴주오\n최후가 묘사되어 있습니다. 인조의 뒤를\n이어 즉위한 효종은 (가) 의 치욕을\n씻기 위해 북벌을 추진하는 한편 순절한\n인물을 기리고 그 후손을 등용하는 정책을\n펼쳤습니다.\n*초수: 포로를 뜻함","choices":["송상현이 동래성에서 항전하였다.","김준룡이 광교산 전투에서 승리하였다.","이괄의 반란 세력이 도성을 장악 지 폐단을 비판했습니다.","우서와 직업적 평등 강조는 유수원의 저술입니다."]},{"id":"76-25","exam":76,"number":25,"era":10,"answer":2,"score":2,"prompt":"다음 자료에 등장하는 왕에 대한 설명으로 옳은 것은? [2점]\n○ 개천이 점점 막혀 …… 장마 때마다 범람할까 근심하게 되었다.\n왕이 이르기를 …… 이에 준천사(濬川司)를 설치하여 병조\n판서와 한성부 판윤, 삼군문의 대장으로 하여금 준천 당상을\n겸하도록 하고 도청, 낭청 각 1인을 두었다. 매년 개천 바닥을\n파서 물이 넘치지 않도록 하였다.\n○ 국초에 신문고를 설치하여 억울함을 지닌 백성들로 하여금\n북을 쳐서 알리도록 하였는데, 그 법이 폐해진 지 이미 오래\n되었다. 왕이 …… 마침내 복구하도록 명하였다. 북을 울리는\n자가 있으면 …… 해당 관청에서 아뢰도록 하였다.","choices":["나선 정벌에 조총 부대를 파견하였다.","통치 규범을 재정비한 속대전을 편찬하였다.","청과 국경을 정한 백두산정계비를 건립하였다.","문신을 재교육하기 위한 초계문신제를 시행하였다.","한성 방어를 위하여 총융청과 수어청을 창설하였다. 26. 다음 가상 대화가 이루어진 시기에 볼 수 있는 모습으로 적절 하지 않은 것은? [2점] 이승훈이 잡혀가고 정약종도 죄인으로 몰려 죽었다고 하네. 우리 교인들에 대한 탄압이 점점 심해지고 있군. 지난달에 대왕대비께서 사학(邪學)에 대한 단속을 강화하라고 하교하셨다는군."],"theme":"영조의 청계천 준설과 속대전","clues":["준천사 설치와 신문고 부활은 영조 때의 제도 정비입니다.","영조는 경국대전을 보완한 속대전을 편찬했습니다."],"conclusion":"정답은 ② 속대전 편찬입니다.","explanations":["나선 정벌의 조총 부대 파견은 효종 때입니다.","속대전은 영조 때 편찬됐습니다.","백두산정계비는 숙종 때 건립됐습니다.","초계문신제는 정조의 정책입니다.","총융청·수어청은 인조 때 설치된 방어 군영입니다."]},{"id":"76-28","exam":76,"number":28,"era":12,"answer":2,"score":3,"prompt":"다음 상소가 올려진 시기를 연표에서 옳게 고른 것은? [3점]\n전 호조 참판 최익현 아룁니다. …… 다행히 성상의 뜻이 척화에 있는 데\n힘입어 기정진과 이항로가 상소를 하여 강화가 불가함을 말하자 전하\n께서 그 말을 받아들여 주셨습니다. 이런 연유로 10년 동안에는 양적\n들이 우리를 탐내었으나 감히 그 뜻을 펴지 못하였습니다. …… 옛날의\n왜인들은 이웃 나라였으나 지금의 왜인들은 도적들이니, 강화할 수\n없습니다. 왜인들이 양적들의 앞잡이가 되었기 때문입니다.\n(가) (나) (다) (라) (마)\n고종 즉위\n신미 양요\n갑신 정변\n을미 사변\n러일 전쟁\n국권 피탈\n발발","choices":["(가)","(나)","(다)","(라)","(마)"],"theme":"최익현의 왜양일체론과 개항 반대","clues":["최익현의 왜양일체론과 강화 반대 상소는 1876년 강화도 조약 체결 무렵입니다.","신미양요(1871) 이후 갑신정변(1884) 이전의 시기입니다."],"conclusion":"정답은 ② (나) 구간입니다.","explanations":["고종 즉위~신미양요 사이보다 뒤입니다.","신미양요(1871)와 갑신정변(1884) 사이인 1876년입니다.","갑신정변 이후가 아닙니다.","을미사변 이후가 아닙니다.","러일 전쟁 이후가 아닙니다."]},{"id":"76-29","exam":76,"number":29,"era":11,"answer":5,"score":2,"prompt":"밑줄 그은 ‘중건’ 시기에 있었던 사실로 옳은 것은? [2점]\n사료로 보는 한국사\n대원위께서 분부하신 내용, “지금 영건할 때에 이른바\n원납전은 실로 힘닿는 대로 내어 공역을 도와야 하는\n것인데, …… 모두 가난하지 않은 자들인데 아직 한푼도\n바친 바가 없으니 또한 무슨 까닭인가  통해 폐정 개혁을 실천했습니다."],"conclusion":"정답은 ③ 집강소를 통한 폐정 개혁입니다.","explanations":["황무지 개간권 요구 저지는 보안회(1904)의 활동입니다.","조선 총독부는 1910년 이후 존재하므로 동학 농민 운동 시기가 아닙니다.","집강소 설치·운영은 동학 농민 운동의 핵심 활동입니다.","남한 대토벌 작전은 1909년 정미의병 탄압과 관련됩니다.","박규수의 안핵사 파견은 1862년 진주 농민 봉기 후의 조치입니다."]},{"id":"76-33","exam":76,"number":33,"era":12,"answer":4,"score":2,"prompt":"밑줄 그은 ‘개혁’의 내용으로 옳은 것은? [2점]\n이번 시간에는 구본신참을 기본 방향으로 내세워 추진한 개혁에 대한 의견을 들어보고자 합니다.\n원수부와 무관학교 설치, 상공 학교와 회사, 공장 설립 등 자주 독립과 근대화에 필요한 문물을 적극적으로 도입하려 한 의미 있는 개혁이었습니다.\n하지만 체제 변화를 부르지 않는 근대적 문물 수용의 확대뿐이었습니다. 일본 등 열강의 간섭에서도 완전히 벗어나지 못하였습니다.","choices":["개혁을 추진하기 위해 군국기무처를 두었다.","행정 기구를 6조에서 8아문으로 개편하였다.","근대식 무기 제조 공장인 기기창을 설립하였다.","토지 소유권을 확인해 주는 지계를 발급하였다.","개혁의 방향을 제시한 홍범 14조를 반포하였다."],"theme":"광무개혁과 지계 발급","clues":["구본신참, 원수부 설치, 상공학교·공장 설립은 대한제국의 광무개혁을 가리킵니다.","광무개혁은 지계 발급으로 토지 소유권을 확인하려 했습니다."],"conclusion":"정답은 ④ 지계 발급입니다.","explanations":["군국기무처는 제1차 갑오개혁을 추진한 기구입니다.","8아문 개편은 제1차 갑오개혁의 내용입니다.","기기창 설립은 1880년대 개화 정책의 일부입니다.","광무개혁은 지계를 발급해 토지 소유권을 확인했습니다.","홍범 14조는 제2차 갑오개혁 시기 반포됐습니다."]},{"id":"76-35","exam":76,"number":35,"era":12,"answer":5,"score":2,"prompt":"(가)에 들어갈 내용으로 가장 적절한 것은? [2점]\n○○ 고 한국사 교실\n홈 게시판 수업 과제 사용자 성적\n캘린더\n▣ 과제 안내\n수업\n보관처리된 수업\n일제는 대한 제국의 외교권을 강탈하고 통감부를 설치하였어요. 이후 전개된 국권 수호 노력을 조사하여 보고서를 작성하고 제목과 함께 제출해 주세요.\n설정\n번호 제 목\n1 신돌석, 의병장으로 활약하다\n2 나철, 오적 처단을 위해 자신회를 조직하다\n3 (가)\n4 이재명, 명동 성당 앞에서 이완용을 습격하다","choices":["김홍집, 조선책략을 가져오다","김옥균, 개화당 정부를 수립하다","김윤식, 영선사로 청에 다녀오다","유길준, 조선 중립화론을 건의하다","이상설, 고종의 특사로 헤이그에 가다"],"theme":"을사늑약 이후 국권 수호 노력","clues":["외교권 박탈과 통감부 설치는 을사늑약(1905년)을 가리킵니다.","이상설은 1907년 헤이그에 파견된 고종의 특사 중 한 사람입니다."],"conclusion":"정답은 ⑤ 이상설의 헤이그 특사 활동입니다.","explanations":["김홍집이 조선책략을 들여온 것은 1880년입니다.","김옥균의 갑신정변은 1884년 사건입니다.","김윤식 영선사 파견은 1881년입니다.","유길준의 조선 중립화론은 1880년대입니다.","헤이그 특사 파견은 을사늑약 이후인 1907년 국권 수호 운동입니다."]},{"id":"76-36","exam":76,"number":36,"era":13,"answer":2,"score":1,"prompt":"밑줄 그은 ‘이 시기’에 볼 수 있는 모습으로 가장 적절한 것은?\n[1점]\n신문 기사로 보는 일제의 식민 통치 정책\n볼기 다섯 개\n솔닙 한 줌에 태 십오\n마차를 타고 가면서 고삐 와 영종도를 공격하였다.","오페르트가 남연군 묘 도굴을 시도하였다.","교조 신원을 요구하는 보은 집회가 열렸다.","병인박해로 천주교 신부와 신자들이 처형되었다.","김홍집이 가지고 온 조선책략이 조선에 유포되었다."],"theme":"병인양요의 배경","clues":["양헌수 부대가 강화 정족산성에서 프랑스군을 물리친 사건은 병인양요(1866)입니다.","그 배경에는 병인박해로 천주교 신부와 신자들이 처형된 일이 있습니다."],"conclusion":"정답은 ④ 병인박해입니다.","explanations":["운요호 사건은 1875년으로 병인양요 이후입니다.","오페르트의 남연군 묘 도굴 시도는 1868년입니다.","보은 집회는 1893년 동학 교도들이 벌였습니다.","병인박해(1866) 이후 프랑스군이 침입하면서 병인양요가 일어났습니다.","조선책략 유포는 1880년 김홍집의 수신사 귀국 뒤입니다."]},{"id":"77-30","exam":77,"number":30,"era":12,"answer":3,"score":3,"prompt":"밑줄 그은 ‘이 개혁’의 내용으로 옳은 것은? [3점]\n이 자료는 조선 정부에서 발행한 관보 제214호\n이다. 관보의 내부(內部) 고시는 이 개혁에 따라\n시행된 단발령을 알리는 내용으로, 국왕이 먼저\n단발을 행하였으니 백성에게 이를 따르라고 하고\n있다. 한편, 관보에 사용된 연호인 건양은 국모\n시해 사건 이후 추진된 이 개혁의 일환으로\n태양력이 도입되면서 새로 정한 것이다.","choices":["박문국을 두어 한성순보를 발행하였다.","근대식 무기 제조 시설인 기기창을 설립하였다.","군제를 개편하여 친위대와 진위대를 설치하였다.","공사 노비법을 혁파하고 과부의 재가를 허용하였다.","비변사를 혁파하여 의정부와 삼군부의 기능을 회복하였다."],"theme":"을미개혁의 주요 내용","clues":["을미사변 후 1895년 실시한 단발령과 건양 연호·태양력 채택은 을미개혁의 특징입니다.","을미개혁에서는 친위대·진위대가 설치되었습니다."],"conclusion":"정답은 ③ 친위대와 진위대 설치입니다.","explanations":["박문국과 한성순보는 1883년 근대 시설 도입입니다.","기기창은 1883년 근대식 무기 제조를 위해 설립됐습니다.","을미개혁 때 친위대와 진위대가 설치됐습니다.","공·사노비제 폐지와 과부 재가 허용은 갑오개혁 내용입니다.","비변사 폐지와 의정부·삼군부 기능 회복은 흥선 대원군 때입니다."]},{"id":"77-31","exam":77,"number":31,"era":12,"answer":2,"score":2,"prompt":"(가) 사건에 대한 설명으로 옳은 것은? [2점]\n이 사진은 퍼시벌 로웰이 찍은 묄렌도르프의 집입니다. 본래 선혜청 당상 민겸호의 집이었으나, 그가 (가) 때 피살되자 고종이 묄렌도르프에게 하사한 것입니다. (가) 을/를 진압한 청의 추천을 받아 조선의 외교 고문으로 부임한 묄렌도르프는 이 집을 서양식으로 개축하여 사용하였습니다.","choices":["김옥균 등 개화파가 주도하였다.","제물포 조약이 체결되는 계기가 되었다.","전개 과정에서 홍범 14조가 반포되었다.","통리기무아문이 설치되는 배경이 되었다.","외규장각 도서가 약탈되는 결과를 가져왔다."],"theme":"임오군란의 전개와 결과","clues":["선혜청 당상 민겸호 피살과 청이 진압 후 묄렌도르프를 추천한 사건은 임오군란(1882)입니다.","임오군란 이후 조선과 일본은 제물포 조약을 체결했습니다."],"conclusion":"정답은 ② 제물포 조약 체결의 계기가 됐습니다.","explanations":["김옥균 등 급진 개화파가 주도한 사건은 갑신정변입니다.","임오군란 후 제물포 조약이 체결됐습니다.","홍범 14조 반포는 제2차 갑오개혁(1894)의 개혁 강령입니다.","통리기무아문은 1880년 설치되어 임오군란 이전입니다.","외규장각 도서 약탈은 1866년 병인양요 때입니다."]},{"id":"77-32","exam":77,"number":32,"era":12,"answer":3,"score":2,"prompt":"밑줄 그은 ‘이 지역’에서 전개된 민족 운동에 대한 설명으로\n옳은 것은? [2점]\n포와유람기는 현순이 이 지역의 호놀룰루 등에서 체류한 경험을 바탕으로 쓴 견문록입니다. 이 책에는 20세기 초 사탕수수 농장에 도착한 초기 한인 이민자들의 생활 모습이 잘 나타나 있으며, 포와(布哇)라고 불렸던 이 지역의 지리, 역사, 문화 등이 기록되어 있습니다.\n포와유람기","choices":["한인 자치 기구인 경학사를 조직하였다.","한인 교육을 위해 박달 학원을 설립하였다.","무장 투쟁을 위해 대조선 국민 군단을 결성하였다.","유학생을 중심으로 2·8 독립 선언서를 발표하였다.","대한 광복군 정부를 중심으로 무장 독립 투쟁을 준비하였다."],"theme":"하와이 지역 한인 독립 운동","clues":["포와(布哇)는 하와이의 한자 표기이고 호놀룰루·사탕수수 농장이 단서입니다.","하와이에서는 박용만 등이 대조선 국민 군단을 결성했습니다."],"conclusion":"정답은 ③ 대조선 국민 군단 결성입니다.","explanations":["경학사는 서간도에 조직됐습니다.","박달 학원은 북간도 지역 한인 교육 기관입니다.","대조선 국민 군단은 하와이에서 결성된 무장 독립 운동 조직입니다.","2·8 독립 선언은 도쿄의 조선인 유학생이 주도했습니다.","대한 광복군 정부는 연해주 블라디보스토크에서 조직됐습니다."]},{"id":"77-33","exam":77,"number":33,"era":12,"answer":2,"score":1,"prompt":"다음 자료에 나타난 조약에 대한 설명으로 옳은 것은? [1점]\n한국사 교실\n수행 과제: 오늘 학습한 조약과 관련된 자료를 조사하여 사진과 설명을\n올려 주세요.\n○○○\n□□□\n△△△\n민영환\n중명전\n자신회\n대한 제국 시기 황실 도서관 등으로 이용 되었던 곳으로 조약이 강제로 체결된 장소임.\n일제의 강요로 조약이 체결되자 이에 항거하는 뜻으로 유서를 남기고 자결함.\n나철, 오기호 등이 조약 에 찬성한 다섯 명의 대신들을 처단하기 위해 조직함.","choices":["청의 알선으로 체결이 추진되었다.","통감부가 설치되는 결과를 가져왔다.","천주교 포교를 허용하는 근거가 되었다.","스티븐스가 외교 고문으로 부임하는 계기가 되었다.","대한 제국 군대의 해산을 규정하는 내용이 포함되어 있다."],"theme":"을사늑약의 체결과 결과","clues":["중명전·민영환의 자결·을사오적 처단을 위한 자신회가 핵심 단서입니다.","1905년 을사늑약으로 대한제국의 외교권이 박탈되고 통감부가 설치됐습니다."],"conclusion":"정답은 ② 통감부 설치입니다.","explanations":["청의 알선은 조미 수호 통상 조약 체결 과정의 단서입니다.","을사늑약으로 통감부가 설치됐습니다.","천주교 포교 허용은 조프 수호 통상 조약과 관련됩니다.","스티븐스의 외교 고문 부임은 제1차 한일 협약 이후 상황입니다.","군대 해산은 1907년 정미 7조약 이후 일어난 일입니다."]},{"id":"77-34","exam":77,"number":34,"era":12,"answer":2,"score":2,"prompt":"(가) 단체에 대한 설명으로 옳은 것은? [2점]\n특별 전시 국외 독립운동의 숨은 주역, 안태국을 기억하다\n우리 기념관에서는 (가) 에서 운영한 태극 서관의 주임 등을\n맡았던 안태국의 공훈을 기리는 특별전을 마련하였습니다. 그는 안창호,\n양기탁 등을 중심으로 비밀리에 결성된 (가) 에서 국외 독립군 기지\n건설을 위해 군자금 모금과 이주민 모집 등에 힘썼습니다. 그의 활동을 알\n수 있는 자료들을 준비하였으니 많은 관심 바랍니다.\n•기간: 2026년 월 일 ~ 월 일\n•장소: △△ 기념관 특별 전시실\n•전시 자료: 안태국 장례식 사진 등  점","choices":["만세보를 발행하였다.","대성 학교를 설립하였다."," 1","exam":77,"number":41,"era":13,"answer":1,"score":2,"prompt":"밑줄 그은 ‘이 부대’에 대한 설명으로 옳은 것은? [2점]\n국민부는 중국의 반일 단체와 연락을 취하여 대규모 항일 행동을\n계획하였지만, 각지의 일본 경관대에게 단원이 검거되고 무기를\n압수당하여 세력이 꺾였다. 그러나 당시 이를 피한 양세봉, 양하산 등\n주요 인물이 흩어졌던 단원을 모아 국민부 산하의 무장 단체를\n재편하여 행동을 재개하였다. 총사령관 양세봉의 지휘 아래\n이 부대는 대도회 등과 함께 한중 연합군을 편성하여 소양구에 이어\n영릉가를 점령하였다.","choices":["흥경성 전투에서 일본군을 격퇴하였다.","일본군의 공세를 피해 자유시로 이동하였다.","이른바 남한 대토벌 작전으로 큰 피해를 입었다.","영국군의 요청으로 인도·미얀마 전선에 파견되었다.","한국인 유격대를 중심으로 조국 광복회를 조직하였다."],"theme":"조선 혁명군과 양세봉의 한중 연합 전투","clues":["국민부 산하 무장 부대, 양세봉 총사령관, 영릉가 점령은 조선 혁명군의 활동을 가리킵니다.","조선 혁명군은 중국 의용군 등과 연합해 흥경성 전투에서 일본군을 격퇴했습니다."],"conclusion":"정답은 ① 흥경성 전투 승리입니다.","explanations":["양세봉의 조선 혁명군은 흥경성 전투 등에서 일본군과 싸웠습니다.","자유시 참변은 1921년 독립군 부대 집결 과정의 사건입니다.","남한 대토벌 작전은 1909년 국내 의병에 대한 일본군의 탄압입니다.","인도·미얀마 전선 파견은 대한민국 임시 정부 한국광복군의 활동입니다.","조국 광복회는 동북 항일 연군과 관련된 조직입니다."]},{"id":"77-42","exam":77,"number":42,"era":13,"answer":5,"score":3,"prompt":"(가)에 들어갈 내용으로 옳은 것은? [3점]\n어느 독립운동가의 주요 행적\n1 ~ 4 는 시간 순\n4 충칭\n1 상하이\n삼균주의에 바탕을 둔\n주권이 국민에게 있음을\n대한민국 임시 정부 건국\n밝힌 대동단결 선언\n강령 초안을 작성함.\n작성에 참여함.\n2 항저우\n3 난징\n윤봉길의 상하이 훙커우\n(가)\n공원 의거 이후 일제의\n탄압을 피해 머무름.","choices":["흥사단을 창립함.","이토 히로부미를 사살함.","한국독립운동지혈사를 저술함.","한국 독립군의 총사령관으로 활약함.","김원봉 등과 함께 민족 혁명당을 결성함."],"theme":"조소앙과 민족 혁명당","clues":["대동단결 선언과 삼균주의에 바탕을 둔 대한민국 임시 정부 건국 강령은 조소앙을 가리킵니다.","조소앙은 김원봉 등과 함께 1935년 민족 혁명당 결성에 참여했습니다."],"conclusion":"정답은 ⑤ 민족 혁명당 결성입니다.","explanations":["흥사단을 창립한 인물은 안창호입니다.","이토 히로부미를 사살한 인물은 안중근입니다.","한국독립운동지혈사를 저술한 인물은 박은식입니다.","한국 독립군 총사령관은 지청천입니다.","조소앙은 김원봉 등과 민족 혁명당 결성에 참여했습니다."]},{"id":"77-43","exam":77,"number":43,"era":13,"answer":2,"score":2,"prompt":"(가)에 들어갈 내용으로 가장 적절한 것은? [2점]\n한국사 교양 강좌\n기념일에 담긴 일제 강점기 사회ㆍ문화\n우리 학회에서는 일제 강점기의 힘든 현실 속에서도 우리\n민족이 기리기 시작한 기념일을 중심으로 당시의 사회와 문화를\n살펴보는 강연을 마련하였습니다. 많은 관심과 참여 바랍니다.\n[제1강] ‌ 어린이날 - 어린이에게서 민족의 미래를 보다\n[제2강] ‌ 메이데이 - 고등 경찰의 경계 속에 첫 노동절 행사가 열리다\n[제3강] ‌ 과학 데이 - 과학의 대중화를 촉진하다\n[제4강] ‌ (가)\n● 일시: 2026년 ◯ ◯월 ◯ ◯일 10:00~16:00 ● 장소:   학회 소회의실","choices":["제헌절 – 첫 헌법 제정의 의미를 강조하다","가갸날 – 우리 말과 글의 소중함을 되새기다","향토 예비군의 날 – 범국민적인 안보의식을 조성하다","은사의 날 – 스승을 향한 감사와 공경의 마음을 전하다","이산가족의 날 - 이산가족 문제에 대한 관심을 제고하다"],"theme":"일제 강점기 가갸날 제정","clues":["어린이날·메이데이·과학 데이는 일제 강점기에 시작된 민족·사회 문화 기념일입니다.","가갸날은 1926년 조선어 연구회가 제정한 한글날의 옛 이름입니다."],"conclusion":"정답은 ② 가갸날입니다.","explanations":["제헌절은 1948년 헌법 제정 이후의 기념일입니다.","가갸날은 1926년부터 우리 말과 글의 소중함을 알렸습니다.","향토 예비군의 날은 대한민국 정부 수립 이후 지정됐습니다.","은사의 날 제정은 현대 교육 문화에 해당합니다.","이산가족의 날은 해방과 분단 이후의 기념일입니다."]},{"id":"77-44","exam":77,"number":44,"era":13,"answer":4,"score":1,"prompt":"밑줄 그은 ‘시기’에 볼 수 있는 모습으로 가장 적절한 것은?\n[1점]\n이곳은 인천 부평에 위치한 일본 육군 조병창입니다. 일제가 국가 총동원법을 시행한 시기에 전쟁 무기 생산을 목적으로 설치되었습니다. 또한 학도 동원 실시 요강에 따라 학생들이 강제로 동원된 곳이기도 했습니다.","choices":["원산 총파업에 동참하는 노동자","국채 보상 운동에 성금을 내는 상인","원각사에서 연극 은세계를 공연하는 배우","황국 신민 서사를 암송하는 국민학교 학생","조선 형평사 창립 대회 현장을 취재하는 기자"],"theme":"국가 총동원법과 민족 말살 통치","clues":["국가 총동원법(1938), 부평 조병창, 학생 강제 동원은 전시 동원 체제를 나타냅니다.","이 시기 일제는 국민학교 학생에게 황국 신민 서사를 암송하도록 강요했습니다."],"conclusion":"정답은 ④ 황국 신민 서사 암송입니다.","explanations":["원산 총파업은 1929년입니다.","국채 보상 운동은 1907년에 시작됐습니다.","연극 은세계는 대한제국 시기 원각사에서 공연됐습니다.","황국 신민 서사 암송은 일제의 전시 황국 신민화 교육입니다.","조선 형평사는 1923년에 창립됐습니다."]},{"id":"77-45","exam":77,"number":45,"era":14,"answer":1,"score":2,"prompt":"다음 자료를 활용한 탐구 활동으로 가장 적절한 것은? [2점]\n농민이나 지주나 간에 중대한 위기에 봉착하고 있다. 농민은 평년\n수확의 절반가량을 세금 등으로 납부하게 됨으로써 자가에서\n소비할 식량도 확보할 수 없는 지경으로 우선 굶어 죽을 수는\n없으니 상환을 연기하든지 분배를 취소하여 달라고 호소하고 있다.\n지주 측에서는 토지 자본을 산업 자본으로 활용하기는커녕\n정조(正租) 1석당 5만 8천여 원이라는 엄청난 헐값으로 환산된 지가\n증권마저 액면의 5할 또는 4할이라는 시세로 매각하거나, 전년도에\n받아야 할 상환금을 다음 해가 되어도 다 받지 못하고 한 달에 60만\n원씩 지불받기로 한 것마저 받지 못하고 있다.","choices":["농지 개혁의 전개 과정을 알아본다.","광주 대단지 사건의 결과를 파악한다.","개발 제한 구역 설정의 목적을 찾아본다.","산미 증식 계획의 추진 배경을 분석한다.","지계아문이 추진한 정책의 내용을 조사한다."],"theme":"대한민국의 농지 개혁","clues":["지주에게 지가 증권을 지급하고 농민에게 토지를 분배한 내용이 제시됩니다.","1949년 농지 개혁법 제정 이후 농지 개혁이 시행됐습니다."],"conclusion":"정답은 ① 농지 개혁 전개 과정을 살펴봅니다.","explanations":["농지 개혁은 지주에게 보상하고 농민에게 분배하는 유상 매수·유상 분배 방식으로 추진됐습니다.","광주 대단지 사건은 1971년의 도시 빈민 문제입니다.","개발 제한 구역은 1970년대 지정되기 시작했습니다.","산미 증식 계획은 1920년대 일제의 식량 수탈 정책입니다.","지계아문은 대한제국 시기에 토지 소유권 확인 사업을 진행했습니다."]},{"id":"77-46","exam":77,"number":46,"era":14,"answer":1,"score":2,"prompt":"(가) 인물에 대한 설명으로 옳은 것은? [2점]\n이 자료는 미소 공동 위원회 미국 대표단 정치고문단 소속인 L. M. 버치 중위가 좌우 합작을 주도한 (가) 을/를 추모하며 남긴 연설문입니다. 엔도 정무총감과의 회담에서 사회 안정에 관한 요구 사항을 관철하는 등 해방 정국을 주도하던 (가) 이/가 암살되자, 버치 중위는 존경의 의미를 담아 한국어 발음을 알파벳으로 표기한 연설문을 작성하였습니다.\n돌아 가신 -\n위대한\n-\n선생님에\n대하여\n조선말로 나는\n한마디\n하겠습니다.\n그는\n영원히\n침묵의\n갔습니다. 나라로\n돌아\n-\n…\n그러나\n그의 친구와","choices":["광복에 대비하여 조선 건국 동맹을 결성하였다.","대한민국 임시 정부 초대 국무총리를 역임하였다.","정읍에서 남한만의 단독 정부 수립을 주장하였다.","헤이그에서 열린 만국 평화 회의에 특사로 파견되었다.","민족을 역사 서술의 중심에 둔 독사신론을 발표하였다."],"theme":"여운형의 좌우 합작 운동","clues":["미소 공동 위원회 정치고문 버치의 추모 연설과 좌우 합작 지도자는 여운형입니다.","여운형은 1944년 광복에 대비해 조선 건국 동맹을 조직했습니다."],"conclusion":"정답은 ① 조선 건국 동맹 결성입니다.","explanations":["여운형은 1944년 조선 건국 동맹을 결성했습니다.","임시 정부 초대 국무총리는 이승만입니다.","정읍 발언으로 남한 단독 정부 수립 가능성을 주장한 이는 이승만입니다.","헤이그 특사는 이준·이상설·이위종입니다.","독사신론의 저자는 신채호입니다."]},{"id":"77-47","exam":77,"number":47,"era":16,"answer":2,"score":3,"prompt":"(가) 정부 시기에 있었던 사실로 옳은 것은? [3점]\n이것은 (가) 정부가 작성한 행정 수도 건설 계획의 일부입니다. 수출 100억 달러를 처음으로 달성하는 등 경제 성장을 이룬 (가) 정부는 수도권 인구 과밀화 억제 등을 내세우며 행정 수도의 건설 계획을 발표했습니다. 당시 충남 공주시 장기면을 중심으로 연기군 일부까지 건설 대상 지역에 포함되어 있는 것을 확인할 수 있습니다.","choices":["최저 임금 위원회가 설치되었다.","포항 제철소 1기 설비가 준공되었다.","전국 민주 노동조합 총연맹이 창립되었다.","칠레와의 자유 무역 협정(FTA)이 체결되었다.","경제 협력 개발 기구(OECD) 회원국이 되었다."],"theme":"박정희 정부의 행정 수도 계획","clues":["수출 100억 달러 최초 달성(1977)과 충청권 행정 수도 이전 계획은 박정희 정부 시기입니다.","포항제철 1기 설비는 1973년 준공됐습니다."],"conclusion":"정답은 ② 포항 제철소 1기 설비 준공입니다.","explanations":["최저 임금 위원회는 1980년대 최저임금제 준비 과정의 기관입니다.","포항제철 1기 설비는 1973년 준공됐습니다.","민주노총 창립은 1995년입니다.","한·칠레 FTA 체결은 2003년입니다.","OECD 가입은 1996년 김영삼 정부 때입니다."]},{"id":"77-49","exam":77,"number":49,"era":17,"answer":2,"score":2,"prompt":"밑줄 그은 ‘이 정부’ 시기에 있었던 사실로 옳은 것은? [2점]\n오늘도 보도 지침이 내려왔군. 이 정부의 언론 통제는 언제까지 계속되려나.\n보도 지침\n◎ ‌ 대학생들, 주한 미상공회의소 점거. 오후 1시 8분에 경찰에\n모두 연행 기사","choices":["사회면 톱기사로 쓰지 말 것.","사진 쓰지 않도록. ◎ ‌ 기사 제목에 ‘호헌’, ‘개헌’이란 말은 일체 쓰지 말 것. ◎ NCC 고문대책위 구성, 보도하지 말 것.","평화 통일을 주장한 조봉암이 처형되었다.","대통령 긴급 명령으로 금융 실명제가 실시되었다.","서울역에서 청량리역 간에 서울 지하철 1호선이 개통되었다."],"theme":"전두환 정부의 보도 지침과 6월 민주 항쟁","clues":["언론 보도 지침, 호헌·개헌 보도 통제, 대학생 시위 탄압은 전두환 정부 시기의 상황입니다.","박종철 고문 치사 사건은 1987년 6월 민주 항쟁의 도화선이 됐습니다."],"conclusion":"정답은 ② 박종철 고문 치사 사건입니다.","explanations":["헝가리 상주 대표부 설치는 노태우 정부 시기 북방 외교와 관련됩니다.","박종철 고문 치사 사건은 1987년 전두환 정부 때 발생했습니다.","조봉암 처형은 1959년 이승만 정부 때입니다.","금융 실명제는 1993년 김영삼 정부 때 시행됐습니다.","서울 지하철 1호선 개통은 1974년 박정희 정부 때입니다."]}]};
(()=>{'use strict';const $=id=>document.getElementById(id),circles=['①','②','③','④','⑤'];let list=[],position=0,selected=null,shown=false,fontStep=0;
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
const era=$('era'),exam=$('exam');era.add(new Option('전체 시대','all'));DB.eras.forEach((n,i)=>era.add(new Option(String(i+1).padStart(2,'0')+'. '+n,String(i))));exam.add(new Option('모든 회차','all'));[...new Set(DB.questions.map(q=>q.exam))].sort((a,b)=>a-b).forEach(x=>exam.add(new Option('제'+x+'회',String(x))));
function apply(){list=DB.questions.filter(q=>(era.value==='all'||q.era===Number(era.value))&&(exam.value==='all'||q.exam===Number(exam.value)));position=0;selected=null;shown=false;render()}
function go(i){if(i<0||i>=list.length)return;position=i;shown=false;selected=null;render();window.scrollTo({top:0,behavior:'instant'})}
function respond(i){if(shown)return;selected=i;shown=true;render();requestAnimationFrame(()=>{$('answerPanel').scrollIntoView({block:'start',behavior:'smooth'})})}
function reveal(){if(shown)return;shown=true;render();requestAnimationFrame(()=>{$('answerPanel').scrollIntoView({block:'start',behavior:'smooth'})})}
function drawAnswer(q){const p=$('answerPanel');p.replaceChildren();p.classList.toggle('hidden',!shown);if(!shown)return;const correct=selected===q.answer;const msg=selected===null?'공식 정답 '+circles[q.answer-1]:correct?'✅ 정답입니다! '+circles[q.answer-1]:'❌ 오답입니다 · 정답 '+circles[q.answer-1];p.append(el('div',msg,'result '+(selected===null||correct?'good':'bad')));p.append(el('div','문제의 핵심 단서','exHeading'));const clues=el('div',undefined,'clues');const ul=el('ul');(q.clues||[]).forEach(s=>ul.append(el('li',s)));clues.append(ul,el('div',q.conclusion||'','conclusion'));p.append(clues,el('div','①~⑤ 선택지별 해설','exHeading'));q.choices.forEach((c,i)=>{const box=el('div',undefined,'exOption'+(i+1===q.answer?' right':''));box.append(el('b',circles[i]+' '+(i+1===q.answer?'정답':'오답')+' · '+c));box.append(el('div',(q.explanations||[])[i]||'개별 해설이 제공되지 않았습니다.'));p.append(box)})}
function render(){const q=list[position];$('count').textContent='현재 '+list.length+'문항';$('numberPicker').replaceChildren();list.forEach((x,i)=>$('numberPicker').add(new Option((i+1)+' · '+x.exam+'회 '+x.number+'번',String(i))));$('numberPicker').value=String(position);$('bar').style.width=q?(100*(position+1)/list.length)+'%':'0%';$('prev').disabled=!q||position===0;$('next').disabled=!q||position===list.length-1;$('reveal').disabled=!q||shown;$('reveal').textContent=shown?'해설 표시 중':'정답 확인';if(!q){$('title').textContent='문제가 없습니다';$('position').textContent='';$('subject').textContent='';$('prompt').textContent='다른 시대 또는 회차를 선택해 주세요.';$('choices').replaceChildren();$('answerPanel').classList.add('hidden');return;}
$('title').textContent='제'+q.exam+'회 · '+q.number+'번';$('position').textContent=(position+1)+' / '+list.length;$('subject').textContent=DB.eras[q.era]+' · '+q.score+'점 · '+q.theme;$('prompt').textContent=q.prompt;$('choices').replaceChildren();q.choices.forEach((c,i)=>{const b=el('button',undefined,'choice'+(shown&&i+1===q.answer?' correct':shown&&selected===i+1?' wrong':''));b.disabled=shown;b.append(el('span',circles[i],'symbol'),el('span',c));b.onclick=()=>respond(i+1);$('choices').append(b)});drawAnswer(q)}
era.onchange=exam.onchange=apply;$('numberPicker').onchange=()=>go(Number($('numberPicker').value));$('prev').onclick=()=>go(position-1);$('next').onclick=()=>go(position+1);$('reveal').onclick=reveal;$('shuffle').onclick=()=>{for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}go(0)};
function resize(delta){fontStep=Math.max(-2,Math.min(4,fontStep+delta));document.documentElement.style.setProperty('--prompt-size',(19+fontStep*2)+'px');document.documentElement.style.setProperty('--choice-size',(17+fontStep*2)+'px');$('fontInfo').textContent=fontStep===0?'기본':(fontStep>0?'+'+fontStep:fontStep);}
$('smaller').onclick=()=>resize(-1);$('larger').onclick=()=>resize(1);apply();})();
</script></body></html>
